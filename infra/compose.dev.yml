# Desarrollo local de la API Go: Postgres 17 y un buzón de mails falso.
# bun run db:up · bun run db:down
# Nombre propio: hay otros proyectos de Compose en esta máquina con carpeta `infra`.
name: mostrador-v2
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mostrador
      # Sólo escucha en localhost: sin contraseña, como la base efímera del CI.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: mostrador
    ports: ['127.0.0.1:5440:5432']
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mostrador']
      interval: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:8026:8025', '127.0.0.1:1026:1025']
volumes:
  pg:
