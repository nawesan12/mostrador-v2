<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 50px;color:{{ fg }};font:600 17px/1 -apple-system,'SF Pro Text',system-ui,sans-serif;position:relative;box-sizing:border-box">
<span style="letter-spacing:-.01em">{{ time }}</span>
<sc-if value="{{ island }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:20px;background:#000"></div></sc-if>
<span style="display:flex;align-items:center;gap:6px">
<span style="display:flex;align-items:flex-end;gap:1.5px;height:12px"><i style="width:3px;height:4px;border-radius:1px;background:currentColor"></i><i style="width:3px;height:6px;border-radius:1px;background:currentColor"></i><i style="width:3px;height:9px;border-radius:1px;background:currentColor"></i><i style="width:3px;height:12px;border-radius:1px;background:currentColor"></i></span>
<svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .6 10.2 10.2 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.3c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 3.9a7 7 0 0 0-4.7 1.8l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c.5 0 1 .2 1.3.5L8 10.8 6.7 9.3c.3-.3.8-.5 1.3-.5Z"></path></svg>
<span style="display:flex;align-items:center;gap:1px"><span style="width:25px;height:12px;position:relative;display:block"><span style="position:absolute;inset:0;border-radius:4px;border:1.2px solid currentColor;opacity:.4;box-sizing:border-box"></span><span style="position:absolute;left:2px;top:2px;bottom:2px;width:17px;border-radius:2px;background:currentColor"></span></span><span style="width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.4"></span></span>
</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:54},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;island&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { fg: this.props.dark ? '#FBF7F2' : '#000', island: this.props.island ?? true, time: this.props.time ?? '9:41' };
  }
}
</script>
</body>
</html>
