<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:14px;font-family:'Instrument Sans',system-ui,sans-serif;color:var(--tx)">
  <div data-r="" style="display:flex;align-items:end;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:220px"><h1 style="margin:0;font-size:30px;letter-spacing:-.035em;font-weight:600">{{ title }}</h1><div style="margin-top:2px;font-size:15px;color:var(--mu)">{{ kpi }}</div></div>
    <button onClick="{{ exportX }}" style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf);color:var(--tx);font:600 13.5px 'Instrument Sans';cursor:pointer;box-shadow:var(--sh);white-space:nowrap"><iconify-icon icon="ph:download-simple-bold" width="14"></iconify-icon>Exportar</button>
    <button onClick="{{ primary }}" style="display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:0;background:linear-gradient(180deg,#E06A3E,#D2582F);color:#fff;font:600 13.5px 'Instrument Sans';cursor:pointer;box-shadow:0 10px 22px -10px rgba(210,88,47,.8);white-space:nowrap"><iconify-icon icon="{{ primaryI }}" width="15"></iconify-icon>{{ primaryT }}</button>
  </div>

  <sc-if value="{{ hasTip }}"><div data-r="" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(210,88,47,.08);border:1px solid rgba(210,88,47,.18)"><img src="assets/hornero/pensando.png" alt="" style="width:40px;height:40px;object-fit:contain;flex:none"><div style="flex:1;min-width:0;font-size:13.5px;line-height:1.4"><b>Hornero:</b> {{ tip }}</div><button onClick="{{ tipGo }}" style="flex:none;padding:8px 14px;border-radius:999px;border:0;background:#2A140C;color:#fff;font:600 12.5px 'Instrument Sans';cursor:pointer;white-space:nowrap">{{ tipBtn }}</button></div></sc-if>

  <div data-r="" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">
    <sc-for list="{{ views }}" as="v" hint-placeholder-count="5"><button onClick="{{ v.go }}" style="display:flex;align-items:center;gap:7px;border:1.5px solid {{ v.bd }};cursor:pointer;white-space:nowrap;font:600 13px 'Instrument Sans';padding:8px 13px;border-radius:999px;background:{{ v.bg }};color:var(--tx)"><iconify-icon icon="{{ v.i }}" width="15" style="color:{{ v.ic }}"></iconify-icon>{{ v.t }}</button></sc-for>
  </div>

  <div data-r="" style="display:flex;border-radius:18px;overflow-x:auto;scrollbar-width:none;background:var(--sf);box-shadow:var(--shd)">
    <sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
      <button onClick="{{ s.go }}" style="flex:1 0 120px;min-width:0;padding:12px 14px;border:0;border-right:1px solid var(--ln);background:{{ s.bg }};cursor:pointer;font-family:inherit;color:var(--tx);text-align:left;transition:background .2s">
        <span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden"><span style="width:8px;height:8px;border-radius:50%;background:{{ s.c }};flex:none"></span>{{ s.t }}</span>
        <span style="display:block;font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:2px">{{ s.n }}</span>
        <span style="display:block;margin-top:6px;height:4px;border-radius:3px;background:{{ s.c }};opacity:{{ s.op }}"></span>
      </button>
    </sc-for>
  </div>

  <div data-r="" style="display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--sf);box-shadow:var(--shd)">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div style="flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--sf3)"><iconify-icon icon="ph:magnifying-glass" width="16" style="color:var(--mu)"></iconify-icon><input value="{{ q }}" onInput="{{ setQ }}" placeholder="{{ ph }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 14px 'Instrument Sans';color:var(--tx)"><sc-if value="{{ hasQ }}"><button onClick="{{ clearQ }}" style="border:0;background:transparent;cursor:pointer;color:var(--mu);display:grid;place-items:center"><iconify-icon icon="ph:x-circle-fill" width="16"></iconify-icon></button></sc-if></div>
      <button onClick="{{ toggleMore }}" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid {{ moreBd }};background:{{ moreBg }};color:var(--tx);font:600 13px 'Instrument Sans';cursor:pointer;white-space:nowrap"><iconify-icon icon="ph:sliders-horizontal-bold" width="15"></iconify-icon>Filtros<sc-if value="{{ nActive }}"><span style="min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#D2582F;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center">{{ nActive }}</span></sc-if></button>
      <button onClick="{{ cycleSort }}" style="display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--ln2);background:var(--sf);color:var(--tx);font:600 13px 'Instrument Sans';cursor:pointer;white-space:nowrap"><iconify-icon icon="ph:sort-ascending-bold" width="15"></iconify-icon>{{ sortTxt }}</button>
    </div>
    <sc-if value="{{ more }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:6px 2px 2px">
        <sc-for list="{{ facets }}" as="f" hint-placeholder-count="3">
          <div><div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px">{{ f.t }}</div><div style="display:flex;flex-wrap:wrap;gap:5px"><sc-for list="{{ f.opts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.go }}" style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1.5px solid {{ o.bd }};background:{{ o.bg }};color:var(--tx);font:600 12.5px 'Instrument Sans';cursor:pointer;white-space:nowrap"><sc-if value="{{ o.icon }}"><iconify-icon icon="{{ o.icon }}" width="14" style="color:{{ o.col }}"></iconify-icon></sc-if>{{ o.t }}<span style="color:var(--fa);font-weight:500">{{ o.n }}</span></button></sc-for></div></div>
        </sc-for>
        <div><div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:6px;display:flex;justify-content:space-between">{{ rangeLbl }}<b style="color:var(--tx)">{{ rangeTxt }}</b></div><input type="range" min="0" max="{{ rangeMax }}" step="{{ rangeStep }}" value="{{ rangeV }}" onInput="{{ setRange }}" style="width:100%;accent-color:#D2582F"></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{ flags }}" as="g" hint-placeholder-count="2"><button onClick="{{ g.go }}" style="display:flex;align-items:center;gap:10px;padding:4px 0;border:0;background:transparent;cursor:pointer;font-family:inherit;color:var(--tx);text-align:left"><span style="flex:1;font-size:13px;font-weight:500">{{ g.t }}</span><span style="position:relative;width:36px;height:21px;flex:none;border-radius:999px;background:{{ g.tbg }};transition:background .25s"><span style="position:absolute;top:2px;left:{{ g.tx }};width:17px;height:17px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 3px rgba(0,0,0,.3)"></span></span></button></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ hasChips }}">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="2"><button onClick="{{ c.x }}" style="display:flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;border-radius:999px;border:0;background:rgba(210,88,47,.12);color:#C24E25;font:600 12.5px 'Instrument Sans';cursor:pointer">{{ c.t }}<iconify-icon icon="ph:x-bold" width="11"></iconify-icon></button></sc-for><button onClick="{{ clearAll }}" style="border:0;background:transparent;cursor:pointer;font:600 12.5px 'Instrument Sans';color:var(--mu);text-decoration:underline">Limpiar todo</button></div>
    </sc-if>
  </div>

  <div data-r="" style="position:relative;border-radius:24px;background:var(--sf);box-shadow:var(--shd);overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ln);font-size:12.5px;color:var(--mu)">
      <button onClick="{{ selAllVis }}" aria-label="Seleccionar visibles" style="width:20px;height:20px;padding:0;border-radius:6px;border:1.5px solid var(--ln2);background:var(--sf);cursor:pointer"></button>
      <span style="flex:1">{{ showing }}</span><span style="display:flex;align-items:center;gap:6px;white-space:nowrap"><iconify-icon icon="ph:lightning-fill" width="13" style="color:#D2582F"></iconify-icon>{{ countTxt }} {{ unit }}</span>
    </div>
    <div data-vs="" data-lenis-prevent="" onScroll="{{ onScroll }}" style="height:{{ vh }};overflow-y:auto;overscroll-behavior:contain;position:relative">
      <div style="position:relative;height:{{ totalH }}">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <div style="position:absolute;left:0;right:0;top:{{ r.top }};height:76px;padding:5px 10px;box-sizing:border-box">
            <div onClick="{{ r.open }}" style="height:100%;display:flex;align-items:center;gap:{{ gap }};padding:0 12px;border-radius:16px;background:{{ r.bg }};border:1px solid {{ r.bd }};cursor:pointer;transition:background .15s" style-hover="background:var(--chip)">
              <button onClick="{{ r.tick }}" aria-label="Seleccionar" style="width:20px;height:20px;flex:none;padding:0;border-radius:6px;border:1.5px solid {{ r.cbd }};background:{{ r.cbg }};color:#fff;cursor:pointer;display:grid;place-items:center"><sc-if value="{{ r.sel }}"><iconify-icon icon="ph:check-bold" width="12"></iconify-icon></sc-if></button>
              <span style="position:relative;flex:none;width:42px;height:42px">
                <sc-if value="{{ r.mImg }}"><img src="{{ r.mImg }}" alt="" style="width:42px;height:42px;border-radius:{{ r.mR }};object-fit:cover;display:block;background:var(--sf3)"></sc-if>
                <sc-if value="{{ r.mIni }}"><span style="width:42px;height:42px;border-radius:{{ r.mR }};display:grid;place-items:center;background:{{ r.mBg }};color:{{ r.mFg }};font-size:14px;font-weight:700">{{ r.mIni }}</span></sc-if>
                <sc-if value="{{ r.bIcon }}"><span style="position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:{{ r.bBg }};box-shadow:0 0 0 2px var(--sf)"><iconify-icon icon="{{ r.bIcon }}" width="12" style="color:{{ r.bCol }}"></iconify-icon></span></sc-if>
              </span>
              <span style="flex:1 1 150px;min-width:0"><span style="display:flex;align-items:center;gap:6px"><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.t }}</span><sc-for list="{{ r.tags }}" as="g" hint-placeholder-count="0"><iconify-icon icon="{{ g.i }}" width="13" title="{{ g.t }}" style="color:{{ g.c }};flex:none"></iconify-icon></sc-for></span><span style="display:block;font-size:12px;color:var(--fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span></span>
              <sc-if value="{{ wide }}"><span style="width:180px;flex:none">
                <sc-if value="{{ r.spark }}"><span style="display:flex;align-items:end;gap:2px;height:22px"><sc-for list="{{ r.spark }}" as="b" hint-placeholder-count="0"><span style="flex:1;height:{{ b.h }};border-radius:2px;background:{{ b.c }}"></span></sc-for></span></sc-if>
                <sc-if value="{{ r.meter }}"><span style="position:relative;display:block;height:8px;border-radius:4px;background:var(--sf3);overflow:visible"><span style="position:absolute;left:0;top:0;bottom:0;width:{{ r.mtW }};border-radius:4px;background:{{ r.mtC }}"></span><sc-if value="{{ r.mtMark }}"><span title="Punto de reposición" style="position:absolute;top:-3px;bottom:-3px;left:{{ r.mtMark }};width:2px;border-radius:1px;background:var(--tx);opacity:.5"></span></sc-if></span></sc-if>
                <sc-if value="{{ r.steps }}"><span style="display:flex;gap:3px"><sc-for list="{{ r.steps }}" as="s" hint-placeholder-count="0"><span style="flex:1;height:5px;border-radius:3px;background:{{ s.c }}"></span></sc-for></span></sc-if>
                <span style="display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:600;color:{{ r.vC }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><sc-if value="{{ r.vI }}"><iconify-icon icon="{{ r.vI }}" width="13"></iconify-icon></sc-if>{{ r.vL }}</span>
              </span></sc-if>
              <sc-if value="{{ r.chip }}"><span style="flex:none;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;background:{{ r.chBg }};color:{{ r.chFg }};white-space:nowrap">{{ r.chip }}</span></sc-if>
              <span style="flex:none;min-width:80px;text-align:right"><span style="display:block;font-size:15px;font-weight:600;letter-spacing:-.01em">{{ r.v }}</span><span style="display:block;font-size:11.5px;color:var(--mu);white-space:nowrap">{{ r.vs }}</span></span>
              <sc-if value="{{ r.stepper }}"><span onClick="{{ r.stop }}" style="flex:none;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--chip)"><button onClick="{{ r.dec }}" aria-label="Restar" style="width:28px;height:28px;border:0;border-radius:50%;background:var(--sf);color:var(--tx);cursor:pointer;display:grid;place-items:center"><iconify-icon icon="ph:minus-bold" width="12"></iconify-icon></button><span style="min-width:30px;text-align:center;font-size:13.5px;font-weight:700">{{ r.qty }}</span><button onClick="{{ r.inc }}" aria-label="Sumar" style="width:28px;height:28px;border:0;border-radius:50%;background:var(--sf);color:var(--tx);cursor:pointer;display:grid;place-items:center"><iconify-icon icon="ph:plus-bold" width="12"></iconify-icon></button></span></sc-if>
              <sc-if value="{{ r.toggle }}"><button onClick="{{ r.tg }}" title="{{ r.tgT }}" style="flex:none;position:relative;width:40px;height:23px;border:0;padding:0;border-radius:999px;background:{{ r.tgBg }};cursor:pointer;transition:background .25s"><span style="position:absolute;top:2px;left:{{ r.tgX }};width:19px;height:19px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 3px rgba(0,0,0,.3)"></span></button></sc-if>
              <sc-if value="{{ r.act }}"><button onClick="{{ r.do }}" style="flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:0;background:{{ r.aBg }};color:{{ r.aFg }};font:600 12.5px 'Instrument Sans';cursor:pointer;white-space:nowrap"><iconify-icon icon="{{ r.aI }}" width="14"></iconify-icon><sc-if value="{{ wide }}">{{ r.act }}</sc-if></button></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ empty }}"><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px"><div><img src="assets/hornero/lupa.png" alt="" style="width:110px;height:110px;object-fit:contain"><div style="font-size:16px;font-weight:600;margin-top:6px">Nada con esos filtros</div><button onClick="{{ clearAll }}" style="margin-top:10px;padding:9px 16px;border-radius:999px;border:0;background:var(--tx);color:var(--sf);font:600 13px 'Instrument Sans';cursor:pointer">Limpiar filtros</button></div></div></sc-if>
    </div>
    <sc-if value="{{ showTop }}"><button onClick="{{ toTop }}" aria-label="Volver arriba" style="position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--tx);color:var(--sf);cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(42,20,12,.5)"><iconify-icon icon="ph:arrow-up-bold" width="16"></iconify-icon></button></sc-if>
  </div>

  <sc-if value="{{ hasSel }}">
    <div style="position:fixed;left:50%;bottom:{{ bulkB }};transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 18px;border-radius:999px;background:#2A140C;color:#fff;box-shadow:0 24px 50px -16px rgba(42,20,12,.7);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none">
      <span style="font-size:14px;font-weight:600;white-space:nowrap;margin-right:6px">{{ selN }} seleccionados</span>
      <sc-for list="{{ bulk }}" as="b" hint-placeholder-count="3"><button onClick="{{ b.go }}" style="display:flex;align-items:center;gap:6px;border:0;cursor:pointer;font:600 13px 'Instrument Sans';padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;white-space:nowrap"><iconify-icon icon="{{ b.i }}" width="14"></iconify-icon>{{ b.t }}</button></sc-for>
      <button onClick="{{ clearSel }}" aria-label="Quitar selección" style="width:34px;height:34px;flex:none;border:0;cursor:pointer;border-radius:50%;background:transparent;color:#D9C8BA;display:grid;place-items:center"><iconify-icon icon="ph:x-bold" width="14"></iconify-icon></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Clientes&quot;, &quot;Productos&quot;, &quot;Inventario&quot;, &quot;Facturación&quot;, &quot;Envíos&quot;], &quot;default&quot;: &quot;Clientes&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;vw&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1400, &quot;tsType&quot;: &quot;number&quot;}, &quot;onToast&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;function&quot;}, &quot;onOpen&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;function&quot;}}">
const fmt = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const fk = n => n >= 1e6 ? '$ ' + (n / 1e6).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' M' : fmt(n);
const U = (id, w) => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&h=${w}&q=60`;
const FACES = ['1531058240690-006c446962d8', '1687422811062-a966b55cb217', '1764173039506-c5cc7b8ec14b', '1520333789090-1afc82db536a', '1687422810663-c316494f725a', '1545262722-9e0d80a0bc01', '1556745753-b2904692b3cd', '1562322140-8baeececf3df'].map(id => U(id, 96) + '&crop=faces');
const PIMG = ['1634741011278-9dc2f5b6fc0b', '1609541994821-d909982e2f1b', '1675001077188-809370ce3279', '1444157545135-c045be691b05', '1585744259332-111384f5def9', '1495474472287-4d71bcdd2085'].map(id => U(id, 96));
const FN = ['Lucía', 'Martín', 'Norma', 'Carla', 'Julián', 'Pablo', 'Valeria', 'Sofía', 'Tomás', 'Camila', 'Agustina', 'Federico', 'Micaela', 'Joaquín', 'Florencia', 'Diego', 'Rocío', 'Nicolás', 'Belén', 'Lautaro'];
const LN = ['Fernández', 'Gómez', 'Ruiz', 'Pereyra', 'Medina', 'Sosa', 'Paz', 'Acosta', 'Ríos', 'Vega', 'Luna', 'Díaz', 'Torres', 'Romero', 'Benítez', 'Álvarez'];
const CITIES = ['Rosario', 'Córdoba', 'CABA', 'La Plata', 'Mendoza', 'Salta', 'Mar del Plata', 'Tucumán', 'Neuquén', 'Santa Fe'];
const PB = [['Termo', 42900, 0], ['Mate de cerámica', 18500, 1], ['Yerba orgánica', 8200, 2], ['Kit matero', 58400, 3], ['Bombilla', 1700, 4], ['Café de especialidad', 9800, 5], ['Mate de calabaza', 14200, 1], ['Matera de cuero', 36500, 3]];
const PV = ['Negro', 'Crema', 'Terracota', 'Verde', '500 g', '1 kg', 'Acero', 'Grande', 'Chico'];
const CHI = { web: ['ph:globe-simple-fill', '#D2582F', 'Tienda'], wa: ['logos:whatsapp-icon', null, 'WhatsApp'], ml: ['ph:handshake-fill', '#2D3277', 'Mercado Libre'], ig: ['logos:instagram-icon', null, 'Instagram'], pos: ['ph:storefront-fill', '#8A5A3E', 'Local'] };
const INI = [['#FCEDE5', '#C24E25'], ['#E9F8EE', '#1F6F4A'], ['#ECEBFB', '#4A47A3'], ['#FFF4D9', '#8A5A08'], ['#F3E9DF', '#6B4A33']];
const ago = d => d < 1 ? 'hoy' : d < 2 ? 'ayer' : d < 30 ? 'hace ' + Math.round(d) + ' días' : d < 365 ? 'hace ' + Math.round(d / 30) + ' meses' : 'hace más de un año';
const mk = (n, s, f) => { let x = s; const r = () => (x = (x * 16807) % 2147483647) / 2147483647; return Array.from({ length: n }, (_, i) => f(i, r)); };
const pick = (r, a) => a[Math.floor(r() * a.length)];

const DATA = {
  Clientes: mk(3200, 11, (i, r) => { const nm = pick(r, FN) + ' ' + pick(r, LN); const orders = Math.max(1, Math.round(Math.pow(r(), 2.2) * 40)); const last = Math.pow(r(), 1.6) * 420; const ltv = orders * (9000 + r() * 40000);
    const seg = orders >= 12 && last < 60 ? 'vip' : orders >= 4 && last < 90 ? 'freq' : orders <= 1 && last < 30 ? 'new' : last > 180 ? 'sleep' : last > 75 ? 'risk' : 'freq';

  state = { scr: null, q: '', f: {}, rng: 0, flags: {}, sort: 0, more: false, top: 0, sel: {}, view: 'all', flip: {}, adj: {}, tipDone: false };
  componentDidMount() { this.anim(); }
  componentDidUpdate() { this.anim(); }
  anim() { document.querySelectorAll('[data-r]:not([data-on])').forEach((el, i) => { el.setAttribute('data-on', ''); el.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: i * 50, fill: 'both', easing: 'cubic-bezier(.2,.7,.1,1)' }); }); }
  toast(k, t, d, a) { this.props.onToast && this.props.onToast(k, t, d, a); }
  scrollTop() { const v = document.querySelector('[data-vs]'); v && (v.scrollTop = 0); this.setState({ top: 0 }); }
  reset(extra) { this.setState({ q: '', f: {}, rng: 0, flags: {}, view: 'all', ...(extra || {}) }); this.scrollTop(); }
  renderVals() {
    const name = CFG[this.props.screen] ? this.props.screen : 'Clientes';
    if (this.state.scr !== name) { setTimeout(() => this.setState({ scr: name, q: '', f: {}, rng: 0, flags: {}, sort: 0, sel: {}, view: 'all', top: 0, tipDone: false, more: false }), 0); }
    const C = CFG[name], D = DATA[name], st = this.state, vw = this.props.vw || 1400, wide = vw >= 900;
    const q = st.q.trim().toLowerCase(), any = m => m && Object.values(m).some(Boolean);
    const val = (o, k) => k === C.segKey && name === 'Inventario' ? o.st : o[k];
    const facetKeys = [C.segKey, ...C.facets.map(f => f[0])];
    const fOk = (o, k) => { const m = st.f[k]; if (!any(m)) return true; const v = o[k]; return Array.isArray(v) ? v.some(x => m[x]) : !!m[v]; };
    const base = o => (!q || C.search(o).toLowerCase().includes(q)) && (!st.rng || (C.rangeLt ? o[C.range[0]] < st.rng : o[C.range[0]] >= st.rng)) && C.flags.every(([k]) => !st.flags[k] || o[k]);
    const pre = D.filter(base), all = (o, skip) => facetKeys.every(k => k === skip || fOk(o, k));
    let list = pre.filter(o => all(o));
    const S = C.sorts[st.sort % C.sorts.length]; list = list.slice().sort(S[2]);
    const n = list.length, vh = vw < 760 ? 520 : 600;
    const start = Math.max(0, Math.floor(st.top / ROW) - 4), end = Math.min(n, Math.ceil((st.top + vh) / ROW) + 6);
    const tog = (k, v) => () => { this.setState(s => ({ f: { ...s.f, [k]: { ...(s.f[k] || {}), [v]: !(s.f[k] || {})[v] } }, view: 'custom' })); this.scrollTop(); };
    const on = (k, v) => !!(st.f[k] || {})[v];
    const cnt = (k, v) => pre.filter(o => all(o, k) && (Array.isArray(o[k]) ? o[k].includes(v) : o[k] === v)).length;
    const chips = [];
    facetKeys.forEach(k => Object.keys(st.f[k] || {}).forEach(v => { if (st.f[k][v]) { const lab = (C.segs.find(s => s[0] === v) || C.facets.flatMap(f => f[2]).find(x => x[0] === v) || [v, v])[1]; chips.push([lab, () => this.setState(s => ({ f: { ...s.f, [k]: { ...s.f[k], [v]: false } } }))]); } }));
    if (st.rng) chips.push([C.range[1] + ' ' + C.range[4](st.rng), () => this.setState({ rng: 0 })]);
    C.flags.forEach(([k, t]) => st.flags[k] && chips.push([t, () => this.setState(s => ({ flags: { ...s.flags, [k]: false } }))]));
    const ui = { toast: (...a) => this.toast(...a), flip: (id, d) => st.flip[id] ?? d, setFlip: (id, v) => this.setState(s => ({ flip: { ...s.flip, [id]: v } })), adj: id => st.adj[id] || 0, setAdj: (id, d) => this.setState(s => ({ adj: { ...s.adj, [id]: (s.adj[id] || 0) + d } })) };
    const selIds = Object.keys(st.sel).filter(k => st.sel[k]);
    const tip = C.tip(pre);
    return {
      title: name, unit: C.unit, ph: C.ph, primaryT: C.primary[0], primaryI: C.primary[1], primary: () => this.toast('ok', C.primary[0], 'Abrimos el formulario'),
      kpi: C.kpi(list), countTxt: n.toLocaleString('es-AR'), wide, gap: wide ? '14px' : '10px', vh: vh + 'px', totalH: (n * ROW) + 'px',
      hasTip: !st.tipDone, tip: tip[0], tipBtn: tip[1], tipGo: () => { this.setState({ tipDone: true }); this.toast('ai', tip[2], tip[3], 'Deshacer'); },
      views: C.views.map(([id, t, i, ic, preset]) => ({ t, i, ic, bd: st.view === id ? '#D2582F' : 'transparent', bg: st.view === id ? 'rgba(210,88,47,.08)' : 'var(--sf)', go: () => { const { st: s1, seg, type, ...flags } = preset; const f = {}; if (s1 || seg) f[C.segKey] = { ...(s1 || seg) }; if (type) f.type = { ...type }; this.reset({ view: id, f, flags }); } })),
      segs: C.segs.map(([k, t, c]) => { const m = cnt(C.segKey, k); const sel = on(C.segKey, k); return { t, c, n: m.toLocaleString('es-AR'), op: sel || !any(st.f[C.segKey]) ? 1 : .25, bg: sel ? 'var(--chip)' : 'transparent', go: tog(C.segKey, k) }; }),
      q: st.q, hasQ: !!st.q, setQ: e => { this.setState({ q: e.target.value, view: 'custom' }); this.scrollTop(); }, clearQ: () => this.setState({ q: '' }),
      more: st.more, toggleMore: () => this.setState(s => ({ more: !s.more })), moreBd: st.more ? '#D2582F' : 'var(--ln2)', moreBg: st.more ? 'rgba(210,88,47,.08)' : 'var(--sf)', nActive: chips.length || null,
      sortTxt: S[1], cycleSort: () => { this.setState(s => ({ sort: (s.sort + 1) % C.sorts.length })); this.scrollTop(); },
      facets: C.facets.map(([k, t, opts]) => ({ t, opts: opts.map(([v, lab, icon, col]) => ({ t: lab, icon, col: col || 'inherit', n: cnt(k, v), bd: on(k, v) ? '#D2582F' : 'var(--ln2)', bg: on(k, v) ? 'rgba(210,88,47,.08)' : 'transparent', go: tog(k, v) })) })),
      rangeLbl: C.range[1], rangeMax: C.range[2], rangeStep: C.range[3], rangeV: st.rng, rangeTxt: st.rng ? C.range[4](st.rng) : 'Cualquiera', setRange: e => { this.setState({ rng: +e.target.value, view: 'custom' }); this.scrollTop(); },
      flags: C.flags.map(([k, t]) => ({ t, tbg: st.flags[k] ? '#D2582F' : '#D9CBBE', tx: st.flags[k] ? '17px' : '2px', go: () => { this.setState(s => ({ flags: { ...s.flags, [k]: !s.flags[k] }, view: 'custom' })); this.scrollTop(); } })),
      hasChips: chips.length > 0, chips: chips.map(([t, x]) => ({ t, x: () => { x(); this.setState({ view: 'custom' }); } })), clearAll: () => this.reset(),
      showing: n ? 'Mostrando ' + (start + 1).toLocaleString('es-AR') + '–' + Math.min(n, start + Math.ceil(vh / ROW)).toLocaleString('es-AR') + ' de ' + n.toLocaleString('es-AR') : 'Sin resultados',
      onScroll: e => { const t = e.currentTarget.scrollTop; if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; this.setState({ top: t }); }); },
      showTop: st.top > 1200, toTop: () => { const v = document.querySelector('[data-vs]'); v && v.scrollTo({ top: 0, behavior: 'smooth' }); }, empty: n === 0,
      rows: list.slice(start, end).map((o, k) => { const sel = !!st.sel[o.id]; const r = C.row(o, ui);
        return { tags: [], spark: null, meter: false, steps: null, chip: null, act: null, stepper: false, toggle: false, mImg: null, mIni: null, bIcon: null, ...r, top: ((start + k) * ROW) + 'px', sel, cbd: sel ? '#D2582F' : 'var(--ln2)', cbg: sel ? '#D2582F' : 'var(--sf)', bg: sel ? 'rgba(210,88,47,.06)' : 'transparent', bd: sel ? 'rgba(210,88,47,.3)' : 'transparent',
          tick: e => { e.stopPropagation(); this.setState(x => ({ sel: { ...x.sel, [o.id]: !x.sel[o.id] } })); }, open: () => this.toast('info', o.t, 'Abrimos la ficha completa') }; }),
      selAllVis: () => this.setState(x => { const s = { ...x.sel }; list.slice(start, end).forEach(o => s[o.id] = true); return { sel: s }; }),
      hasSel: selIds.length > 0, selN: selIds.length, clearSel: () => this.setState({ sel: {} }), bulkB: vw < 760 ? '92px' : '84px',
      bulk: C.bulk.map(([i, t]) => ({ i, t, go: () => { const m = selIds.length; this.setState({ sel: {} }); this.toast('ok', t + ' · ' + m + ' ' + C.unit, 'Listo. Te avisamos si algo falla.', 'Deshacer'); } })),
      exportX: () => this.toast('ok', 'Exportando ' + n.toLocaleString('es-AR') + ' ' + C.unit, 'Con los filtros aplicados · llega a tu email')
    };
  }
}
</script>
