  /v1/panel/datos/exportaciones:
    post:
      operationId: registrarExportacion
      summary: Anota una descarga en "Exportaciones recientes" (guarda las últimas 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, formato]
              properties:
                tipo: { type: string, enum: [productos, clientes, pedidos, facturas, resenas, conversaciones, todo] }
                formato: { type: string, enum: [csv, excel] }
      responses:
        '204': { description: Anotada }
  /v1/panel/datos/inactivos:
    delete:
      operationId: borrarInactivos
      summary: Programa el borrado de los clientes sin compras en 3 años (7 días para frenarlo).
      responses:
        '200':
          description: Programado
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes: { type: integer }
    post:
      operationId: frenarBorrado
      responses:
        '204': { description: Frenado }
  /v1/panel/cuenta:
    delete:
      operationId: cerrarCuenta
      summary: Cierra la tienda. 90 días para arrepentirse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmacion]
              properties:
                confirmacion: { type: string }
      responses:
        '204': { description: Cerrada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/tienda:
    get:
      operationId: obtenerTienda
      summary: La tienda de la sesión
      responses:
        '200':
          description: Tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '401':
          description: Sin sesión
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /v1/panel/turnos/ajustes:
    get:
      operationId: ajustesTurnos
      summary: Turnos con seña — si están activos, la seña, la anticipación, los días de vista y el horario.
      responses:
        '200':
          description: Ajustes (los de por defecto si nunca se guardaron)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AjustesTurnos' }
    put:
      operationId: guardarAjustesTurnos
      summary: Guarda los ajustes de turnos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AjustesTurnos' }
      responses:
        '200':
          description: Como quedaron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AjustesTurnos' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/servicios:
    get:
      operationId: serviciosTurnos
      summary: Los servicios que se reservan (activos e inactivos), por orden.
      responses:
        '200':
          description: Servicios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
    post:
      operationId: crearServicio
      summary: Un servicio nuevo (va al final del orden si no trae uno).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/servicios/{id}:
    put:
      operationId: guardarServicio
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEditable' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarServicio
      summary: Lo saca (los turnos ya tomados quedan con el nombre copiado).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/profesionales:
    get:
      operationId: profesionalesTurnos
      summary: Quienes atienden (activos e inactivos), por orden.
      responses:
        '200':
          description: Profesionales
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Profesional' } }
    post:
      operationId: crearProfesional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfesionalEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profesional' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/profesionales/{id}:
    put:
      operationId: guardarProfesional
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfesionalEditable' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profesional' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarProfesional
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos:
    get:
      operationId: agendaTurnos
      summary: La agenda entre dos días (inclusive), opcionalmente de un profesional; por inicio.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: profesional, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Turnos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Turno' } }
        '400': { $ref: '#/components/responses/Problema' }
    post:
      operationId: crearTurno
      summary: Un turno cargado a mano (origen panel, sin seña). Si se superpone, 409 salvo que venga forzar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnoNuevo' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { description: 'ocupado: se superpone con otro turno (mandar forzar para tomarlo igual)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/turnos/{id}:
    patch:
      operationId: estadoTurno
      summary: Cualquiera de los cinco estados (también sirve para deshacer).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoTurno' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/{id}/devolver-sena:
    post:
      operationId: devolverSena
      summary: Devuelve la seña pagada con Mercado Pago (Reembolsar). Cancelar no la devuelve sola.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: El turno con la seña devuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_sena (no hay seña pagada) o sin_cobros (sin Mercado Pago)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos:
    get:
      operationId: turnosPublicos
      summary: Servicios y profesionales activos y los ajustes públicos. 404 si la tienda no tiene turnos activos.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Turnos de la tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnosPublicos' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      operationId: reservarTurno
      summary: Reserva desde la tienda. Precio, duración y seña salen del servicio; la disponibilidad se re-chequea en una transacción. Con seña y Mercado Pago devuelve el checkout (url).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaTurno' }
      responses:
        '201':
          description: Reservado
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string }, url: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'ocupado: el horario ya no está libre', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos/libres:
    get:
      operationId: turnosLibres
      summary: Los horarios libres de un día (regla 1). Sin profesional (o "cualquiera") sirve si alguno está libre.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: servicio, in: query, required: true, schema: { type: string } }
        - { name: profesional, in: query, required: false, schema: { type: string } }
        - { name: dia, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Horarios libres, por hora
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HorarioLibre' } }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos/{codigo}:
    get:
      operationId: turnoPublico
      summary: El turno por su código público (la confirmación).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Turno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnoPublico' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: cancelarTurnoPublico
      summary: Cancela el turno (hasta anticipacionMin antes; cancelar uno cancelado no es error). Con seña pagada, la devolución la hace la tienda.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnoPublico' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'tarde: falta menos que la anticipación mínima', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/telegram:
    get:
      operationId: estadoTelegram
      summary: Hornero en Telegram — si hay un chat vinculado a la tienda y con qué nombre.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoTelegram' }
    delete:
      operationId: desvincularTelegram
      summary: Desvincula el chat (dueña o admin). Devuelve el chat que estaba para que el BFF le avise; el navegador no lo ve.
      responses:
        '200':
          description: Desvinculado
          content:
            application/json:
              schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
        '204': { description: No había chat vinculado }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/telegram/codigo:
    post:
      operationId: codigoTelegram
      summary: Código de un solo uso (10 min) para vincular un chat con el bot (dueña o admin). El anterior deja de servir.
      responses:
        '201':
          description: Código
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoTelegram' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones:
    post:
      operationId: crearImportacion
      summary: 'Empieza a importar la tienda desde otra plataforma (dueña o admin). Una sola activa por tienda. Con la API avanza sola por el outbox; en la demo, de a un lote por pedido del navegador (avanzarImportacion).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportacionNueva' }
      responses:
        '201':
          description: Creada (pendiente, con el primer paso encolado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'importacion_activa, sin_fuente (todavía no se importa desde esa plataforma) o sin_cifrado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/actual:
    get:
      operationId: importacionActual
      summary: La importación en curso o, si no hay, la última.
      responses:
        '200':
          description: Importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '204': { description: Nunca se importó nada }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones/tiendanube:
    get:
      operationId: tiendanubeDisponible
      summary: Si este servidor puede conectar una tienda de Tiendanube (tiene la app de socio y con qué cifrar el token).
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema:
                type: object
                required: [disponible]
                properties:
                  disponible: { type: boolean }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones/tiendanube/conectar:
    post:
      operationId: conectarTiendanube
      summary: La URL de autorización de la app de Tiendanube (dueña o admin), con un state de un solo uso de 10 minutos.
      responses:
        '200':
          description: Adónde mandar a la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_tiendanube: el servidor no tiene la app configurada', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/tiendanube/vuelta:
    post:
      operationId: volverTiendanube
      summary: 'La vuelta del OAuth: consume el state, canjea el código por el token (que se guarda cifrado y nunca vuelve) y crea la importación.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, estado]
              properties:
                codigo: { type: string, maxLength: 512 }
                estado: { type: string, maxLength: 512 }
      responses:
        '201':
          description: Importación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '400': { description: 'El state no existe, venció o ya se usó', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_tiendanube, importacion_activa o sin_cifrado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { description: 'tiendanube: no aceptó el código', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/{id}/cancelar:
    post:
      operationId: cancelarImportacion
      summary: Frena una importación en curso (dueña o admin). Lo ya guardado queda; la credencial se borra.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'terminada: ya había terminado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/clientes/{id}/historial:
    get:
      operationId: historialCliente
      summary: 'Los pedidos importados de otra plataforma de un cliente (el id de la lista de Clientes), del más nuevo al más viejo, hasta 200. No son pedidos de Tu Local Web.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PedidoHistorial' } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/redireccion:
    get:
      operationId: redireccionTienda
      summary: 'Un link de la tienda vieja: 301 con Location = el path en Tu Local Web, relativo a la tienda. Lo pide el BFF cuando un path de /t/{slug} no existe.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 2000 }, description: 'El path pedido (se normaliza: sin query, en minúsculas, sin barra final)' }
      responses:
        '301':
          description: Redirección
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, required: [hacia], properties: { hacia: { type: string } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/telegram/vincular:
    post:
      operationId: vincularTelegram
      summary: 'El /start del bot: canjea el código y vincula el chat. Sólo el BFF (X-Mostrador-BFF).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, chat, nombre]
              properties:
                codigo: { type: string }
                chat: { type: integer, format: int64 }
                nombre: { type: string, description: 'Nombre de quien escribe en Telegram' }
      responses:
        '200':
          description: Vinculado
          content:
            application/json:
              schema: { type: object, required: [tienda], properties: { tienda: { type: string } } }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'codigo_invalido (vencido, usado o inexistente) o chat_ocupado (el chat está en otra tienda)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/telegram/desvincular:
    post:
      operationId: desvincularChatTelegram
      summary: 'El /desvincular del bot. Sólo el BFF.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
      responses:
        '204': { description: Desvinculado }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/telegram/contexto:
    post:
      operationId: contextoTelegram
      summary: 'Lo que necesita Hornero para responder en el chat (lo mismo que el panel) y cuántos mensajes lleva hoy la tienda (suma este). Sólo el BFF.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextoTelegram' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/ingresar:
    post:
      operationId: equipoIngresar
      summary: Ingreso de una persona del equipo (cuenta aparte de las de las tiendas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, clave], properties: { email: { type: string }, clave: { type: string } } }
      responses:
        '200': { description: Sesión del equipo, content: { application/json: { schema: { $ref: '#/components/schemas/SesionNueva' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/equipo/salir:
    post:
      operationId: equipoSalir
      responses:
        '204': { description: Sesión cerrada }
  /v1/equipo/sesion:
    get:
      operationId: equipoSesion
      responses:
        '200': { description: Quién está y qué puede hacer, content: { application/json: { schema: { $ref: '#/components/schemas/SesionEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/equipo/inicio:
    get:
      operationId: equipoInicio
      responses:
        '200': { description: Números y alertas del día, content: { application/json: { schema: { $ref: '#/components/schemas/InicioEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas:
    get:
      operationId: equipoTiendas
      summary: 'Todas las tiendas, con el motor de listas (filas: FilaTiendaEquipo). Segmento: estado. Facetas: plan, rubro, plantilla, partner. Rango: días desde el alta (menor que).'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: seg, in: query, schema: { type: string } }
        - { name: facetas, in: query, schema: { type: string } }
        - { name: rango, in: query, schema: { type: integer, minimum: 0 } }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, nombre, mrr] } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { $ref: '#/components/schemas/ListaGenerica' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}:
    get:
      operationId: equipoFichaTienda
      summary: Ficha de una tienda. Queda en la auditoría (ver_ficha).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ficha, content: { application/json: { schema: { $ref: '#/components/schemas/FichaTiendaEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/acciones:
    post:
      operationId: equipoAccionTienda
      summary: 'Una acción sobre la tienda, con su permiso por rol. Se aplica y se audita en la misma transacción (equipo.accion_tienda).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccionTiendaEquipo' }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/notas:
    post:
      operationId: equipoNota
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [texto], properties: { texto: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        '201': { description: Nota, content: { application/json: { schema: { $ref: '#/components/schemas/NotaEquipo' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/mirar:
    post:
      operationId: equipoMirarTienda
      summary: 'Token de sólo lectura (30 min) para ver el panel de la tienda como la ve la dueña. Queda en la auditoría (mirar_tienda).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/SesionNueva' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas:
    get:
      operationId: equipoConsultas
      summary: 'Bandeja: contacto y arrepentimientos (con código ARR y plazo legal), con la gente del equipo para asignar.'
      responses:
        '200': { description: Bandeja, content: { application/json: { schema: { $ref: '#/components/schemas/BandejaEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas/{tipo}/{id}:
    get:
      operationId: equipoConsulta
      summary: Una consulta con sus respuestas. Queda en la auditoría (ver_consulta).
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Consulta, content: { application/json: { schema: { $ref: '#/components/schemas/ConsultaDetalle' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      operationId: equipoActualizarConsulta
      summary: Cambia el estado o la persona asignada.
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoConsulta' }
                asignadoA: { type: [string, 'null'], description: 'Id de la persona del equipo; null la desasigna' }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas/{tipo}/{id}/responder:
    post:
      operationId: equipoResponder
      summary: 'Responde por mail (outbox → correo). Una consulta nueva pasa a en curso.'
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asunto, texto]
              properties:
                asunto: { type: string, minLength: 3, maxLength: 140 }
                texto: { type: string, minLength: 3, maxLength: 4000 }
      responses:
        '201': { description: Respuesta encolada, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaEquipo' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/partners:
    get:
      operationId: equipoPartners
      responses:
        '200': { description: Postulaciones y partners activos, content: { application/json: { schema: { $ref: '#/components/schemas/PartnersEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/partners/{id}:
    post:
      operationId: equipoDecidirPartner
      summary: 'Aprueba o rechaza una postulación (el rechazo pide motivo). Avisa por mail y, al aprobar, da de alta al partner (paquete partners).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [aprobar, rechazar] }
                motivo: { type: string, maxLength: 500 }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/equipo/facturacion:
    get:
      operationId: equipoFacturacion
      responses:
        '200': { description: Abonos y comprobantes, content: { application/json: { schema: { $ref: '#/components/schemas/FacturacionEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/auditoria:
    get:
      operationId: equipoAuditoria
      parameters:
        - { name: miembro, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { name: tienda, in: query, schema: { type: string } }
      responses:
        '200': { description: Últimos 300 registros, content: { application/json: { schema: { $ref: '#/components/schemas/AuditoriaEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
components:
  responses:
    Problema:
      description: Error (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Plataforma:
      type: string
      enum: [tiendanube, shopify, woocommerce, mercadolibre, empretienda, csv]
    ImportacionNueva:
      type: object
      required: [plataforma]
      properties:
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        url: { type: string, maxLength: 300, description: 'La dirección de la tienda vieja (http o https)' }
        credencial: { type: string, maxLength: 4096, description: 'Token o clave de la plataforma vieja si la fuente la pide. Se guarda cifrada y nunca vuelve; en la demo no se guarda' }
    ProgresoImportacion:
      type: object
      required: [productos, clientes, pedidos, redirecciones, repetidos, recortados]
      properties:
        productos: { type: integer }
        clientes: { type: integer }
        pedidos: { type: integer }
        redirecciones: { type: integer }
        repetidos: { type: integer, description: 'Lo que ya estaba (mismo email, SKU, URL o pedido)' }
        recortados: { type: integer, description: 'Lo que entró con algo cortado (textos largos, más de 8 fotos o de 100 líneas)' }
    ErrorImportacion:
      type: object
      required: [etapa, externo, detalle]
      properties:
        etapa: { type: string }
        externo: { type: string, description: 'El id en la plataforma vieja (vacío si el error es de la fuente)' }
        detalle: { type: string }
    Importacion:
      type: object
      required: [id, plataforma, urlOrigen, estado, etapa, progreso, errores, creada, terminada]
      properties:
        id: { type: string }
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        urlOrigen: { type: string }
        estado: { type: string, enum: [pendiente, corriendo, lista, fallida, cancelada] }
        etapa: { type: string, enum: [productos, clientes, pedidos, redirecciones] }
        progreso: { $ref: '#/components/schemas/ProgresoImportacion' }
        errores: { type: array, maxItems: 50, description: 'Los últimos 50', items: { $ref: '#/components/schemas/ErrorImportacion' } }
        creada: { type: string, format: date-time }
        terminada: { type: [string, 'null'], format: date-time }
    PedidoHistorial:
      type: object
      required: [id, plataforma, numero, fecha, total, items, estado]
      properties:
        id: { type: string }
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        numero: { type: string, description: 'El número en la plataforma vieja (#1043)' }
        fecha: { type: string, format: date-time }
        total: { type: integer, description: 'En pesos' }
        items:
          type: array
          items:
            type: object
            required: [nombre, variante, cantidad, precio]
            properties:
              nombre: { type: string }
              variante: { type: string }
              cantidad: { type: integer }
              precio: { type: integer }
        estado: { type: string, description: 'Tal como venía de la plataforma' }
    EstadoTelegram:
      type: object
      required: [vinculado]
      properties:
        vinculado: { type: boolean }
        nombre: { type: string, description: 'Nombre de quien vinculó el chat' }
        desde: { type: string, format: date-time }
    CodigoTelegram:
      type: object
      required: [codigo, venceEn]
      properties:
        codigo: { type: string, description: '8 letras y números (sin 0, 1, I ni O)' }
        venceEn: { type: string, format: date-time }
    ContextoTelegram:
      type: object
      required: [tienda, hoy, semana, contexto, usos]
      properties:
        tienda: { $ref: '#/components/schemas/Tienda' }
        hoy: { $ref: '#/components/schemas/Tablero' }
        semana: { $ref: '#/components/schemas/Tablero' }
        contexto: { $ref: '#/components/schemas/ContextoHornero' }
        usos: { type: integer, description: 'Mensajes a Hornero hoy (hora de Argentina), contando este' }
    ResumenPanel:
      type: object
      required: [insignias, notificaciones, canales, prueba]
      properties:
        insignias:
          type: object
          description: 'Números del menú (0: sin insignia)'
          required: [pedidos, carritos, whatsapp, paraHacer]
          properties:
            pedidos: { type: integer, description: 'Para preparar' }
            carritos: { type: integer, description: 'Carritos abandonados recuperables' }
            whatsapp: { type: integer, description: 'Conversaciones sin leer' }
            paraHacer: { type: integer, description: 'Tareas de hoy' }
        notificaciones:
          type: array
          items: { $ref: '#/components/schemas/Notificacion' }
        canales:
          type: array
          description: 'Canales conectados (ids: wa, ml, mp, ig, tg)'
          items: { type: string }
        prueba:
          type: object
          required: [plan, diasRestantes, diasTotales]
          properties:
            plan: { type: string }
            diasRestantes: { type: integer }
            diasTotales: { type: integer }
    Comparado:
      type: object
      description: 'El valor del período y el del período anterior del mismo largo'
      required: [actual, anterior]
      properties:
        actual: { type: number }
        anterior: { type: number }
    ContextoHornero:
      type: object
      required: [ventasPorDia, productos, clientes, canales30d]
      properties:
        ventasPorDia:
          type: array
          description: 'Últimos 14 días, del más viejo a hoy (hora de Argentina)'
          items:
            type: object
            required: [fecha, ventas, pedidos]
            properties:
              fecha: { type: string, format: date }
              ventas: { type: integer }
              pedidos: { type: integer }
        productos:
          type: array
          items:
            type: object
            required: [nombre, categoria, precio, stock, vendidos30d, enMl]
            properties:
              nombre: { type: string }
              categoria: { type: [string, 'null'] }
              precio: { type: integer }
              stock: { type: integer }
              vendidos30d: { type: integer }
              enMl: { type: boolean }
        clientes:
          type: object
          required: [total, nuevos30d, conWhatsApp, sinVolver]
          properties:
            total: { type: integer }
            nuevos30d: { type: integer }
            conWhatsApp: { type: integer }
            sinVolver: { type: integer, description: 'Compraron más de una vez y hace 30 días que no vuelven' }
        canales30d:
          type: array
          items:
            type: object
            required: [canal, ventas]
            properties:
              canal: { type: string }
              ventas: { type: integer }
    NombreLista:
      type: string
      enum: [clientes, productos, inventario, facturacion, envios]
    ListaGenerica:
      type: object
      required: [total, filas, segmentos, facetas, resumen]
      properties:
        total: { type: integer }
        filas:
          type: array
          description: 'Registros de la lista (la forma depende de la lista: ver FilaCliente, FilaProducto, …). Productos: cada fila trae `variantes: {id, texto, sku, precio, stock, activa}[]`. Inventario: `variantes: {id: "producto:variante", varianteId, texto, sku, stock, activa}[]` y el stock de la fila es el total; ajustar, ingreso y conteo aceptan esos ids'
          items: { type: object, additionalProperties: true }
        segmentos:
          type: object
          description: 'Conteo por segmento, sin el filtro de segmento'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Por faceta, conteo de cada valor sin el filtro de esa faceta'
          additionalProperties: { type: object, additionalProperties: { type: integer } }
        resumen:
          type: object
          description: 'Números para el encabezado y la sugerencia de Hornero (dependen de la lista)'
          additionalProperties: { type: number }
    ProductoEditable:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, maxLength: 4000 }
        categoria: { type: [string, 'null'], maxLength: 60 }
        precio: { type: integer, minimum: 0 }
        costo: { type: integer, minimum: 0 }
        sku: { type: string, maxLength: 40 }
        stock: { type: integer, minimum: 0 }
        foto: { type: [string, 'null'], description: 'La portada (fotos[0]). Sin `fotos`: reemplaza la portada y deja el resto; null vacía la galería' }
        fotos:
          type: array
          maxItems: 8
          description: 'Galería: la primera es la portada (ids de foto o URLs https). Sin vacías; las repetidas se descartan'
          items: { type: string }
        opciones:
          type: array
          maxItems: 3
          description: 'Talle, Color, Presentación… Con opciones se vende por variante y el `stock` del producto se ignora (es la suma de las activas). Sin mandar: quedan las que había; [] las saca. Hasta 100 combinaciones; nombres y valores repetidos se comparan sin mayúsculas ni tildes'
          items: { $ref: '#/components/schemas/OpcionProducto' }
        variantes:
          type: array
          maxItems: 100
          description: 'Sólo las que se tocan, identificadas por sus valores. Al guardar se generan las combinaciones: las nuevas arrancan con stock 0 y activas; las que dejan de existir se borran'
          items: { $ref: '#/components/schemas/VarianteEditable' }
        canales:
          type: object
          description: 'Dónde se publica: web, ml, ig, google'
          additionalProperties: { type: boolean }
    OpcionProducto:
      type: object
      required: [nombre, valores]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 20 }
        valores:
          type: array
          minItems: 1
          maxItems: 20
          description: 'Sin repetidos'
          items: { type: string, minLength: 1, maxLength: 20 }
    VarianteEditable:
      type: object
      required: [valores]
      properties:
        valores:
          type: object
          description: 'Una clave por opción, con un valor de esa opción: identifica la combinación'
          additionalProperties: { type: string }
        sku: { type: string, maxLength: 40 }
        precio: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio del producto' }
        stock: { type: integer, minimum: 0, maximum: 1000000, description: 'Sin mandar: el que tenía (0 si es nueva)' }
        foto: { type: [string, 'null'], description: 'Una de las fotos del producto' }
        activa: { type: boolean, description: 'Sin mandar: la que tenía (true si es nueva)' }
    Variante:
      type: object
      required: [id, valores, sku, precio, stock, foto, activa]
      properties:
        id: { type: string }
        valores:
          type: object
          description: 'Una clave por opción del producto, con un valor de esa opción'
          additionalProperties: { type: string }
        sku: { type: string, maxLength: 40 }
        precio: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio del producto' }
        stock: { type: integer, minimum: 0 }
        foto: { type: [string, 'null'], description: 'Una de las fotos del producto' }
        activa: { type: boolean }
    Producto:
      allOf:
        - { $ref: '#/components/schemas/ProductoEditable' }
        - type: object
          required: [id, publicado, vendidos30d, slug, fotos, opciones, variantes]
          properties:
            id: { type: string }
            publicado: { type: boolean }
            vendidos30d: { type: integer }
            slug: { type: string }
            fotos: { type: array, items: { type: string } }
            opciones: { type: array, items: { $ref: '#/components/schemas/OpcionProducto' } }
            variantes: { type: array, description: 'En el orden de las combinaciones', items: { $ref: '#/components/schemas/Variante' } }
    MovimientoStock:
      type: object
      required: [tipo, texto, cantidad, en]
      properties:
        tipo: { type: string, enum: [web, local, ml, ajuste, conteo, ingreso, devolucion] }
        texto: { type: string }
        cantidad: { type: integer, description: 'Negativo: sale; positivo: entra' }
        en: { type: string, format: date-time }
    ConversacionBreve:
      type: object
      required: [id, nombre, foto, canal, ultimo, creado, atiende, sinLeer]
      properties:
        id: { type: string }
        nombre: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string, enum: [wa, ig, tg, ml] }
        ultimo: { type: string, description: 'El último mensaje' }
        creado: { type: string, format: date-time }
        atiende: { type: string, enum: [hornero, vos, resuelto] }
        sinLeer: { type: integer }
    Conversacion:
      allOf:
        - { $ref: '#/components/schemas/ConversacionBreve' }
        - type: object
          required: [mensajes, sugerencia, tomada, cliente, clienteId]
          properties:
            clienteId: { type: [string, 'null'], description: 'Su ficha, para crearle un pedido' }
            mensajes:
              type: array
              items:
                type: object
                required: [de, texto, en]
                properties:
                  de: { type: string, enum: [cliente, hornero, vos] }
                  texto: { type: string }
                  en: { type: string, format: date-time }
                  producto:
                    type: [object, 'null']
                    description: 'Tarjeta de producto que mandó Hornero'
                    required: [nombre, foto, precio, stock]
                    properties:
                      nombre: { type: string }
                      foto: { type: [string, 'null'] }
                      precio: { type: integer }
                      stock: { type: integer }
            sugerencia: { type: [string, 'null'], description: 'Respuesta que propone Hornero' }
            tomada: { type: boolean, description: 'La atiende la persona (Hornero en pausa)' }
            cliente:
              type: object
              required: [ciudad, desde, gastado, pedidos, etiquetas, ultimoPedido, sabe]
              properties:
                ciudad: { type: string }
                desde: { type: string, format: date-time }
                gastado: { type: integer }
                pedidos: { type: integer }
                etiquetas: { type: array, items: { type: string } }
                ultimoPedido:
                  type: [object, 'null']
                  required: [numero, resumen, total, estado]
                  properties:
                    numero: { type: integer }
                    resumen: { type: string }
                    total: { type: integer }
                    estado: { $ref: '#/components/schemas/EstadoPedido' }
                sabe: { type: [string, 'null'], description: 'Lo que Hornero aprendió de esta persona' }
    AutomaticosCarritos:
      type: object
      required: [hora, dia, email]
      properties:
        hora: { type: boolean, description: 'WhatsApp a la hora' }
        dia: { type: boolean, description: 'Segundo aviso a las 24 h con 5% off' }
        email: { type: boolean, description: 'Email al tercer día' }
    Carritos:
      type: object
      required: [carritos, abiertos, monto, recuperado, tasa, costoMensaje, automaticos]
      properties:
        carritos:
          type: array
          items:
            type: object
            required: [id, nombre, foto, desde, creado, fotos, cantidad, total, recordado]
            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              desde: { type: string, description: 'Por dónde llegó: la tienda, Instagram…' }
              creado: { type: string, format: date-time }
              fotos: { type: array, items: { type: [string, 'null'] } }
              cantidad: { type: integer }
              total: { type: integer }
              recordado: { type: boolean }
        abiertos: { type: integer }
        monto: { type: integer }
        recuperado: { type: integer, description: 'Recuperado este mes' }
        tasa: { type: number, description: 'Porcentaje recuperado (0–100)' }
        costoMensaje: { type: integer }
        automaticos: { $ref: '#/components/schemas/AutomaticosCarritos' }
    PedidoNuevo:
      type: object
      required: [items, pago, canal]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string }
              varianteId: { type: [string, 'null'], description: 'Obligatoria si el producto tiene opciones; activa y de ese producto' }
              cantidad: { type: integer, minimum: 1, maximum: 10000 }
        pago: { type: string, enum: [mp, tarjeta, payway, modo, uala, transf, efectivo] }
        canal: { type: string, enum: [pos, wa, web, ig, ml, tg] }
        envio: { type: string, enum: [retiro, andreani, oca, correo, moto, mercadoenvios], default: retiro }
        cliente: { type: [string, 'null'], maxLength: 80, description: 'Nombre (en el local suele no haber)' }
        clienteId: { type: [string, 'null'], maxLength: 80, description: 'Un cliente que ya existe (el nombre sale de su ficha)' }
        telefono: { type: [string, 'null'], maxLength: 30 }
        nota: { type: [string, 'null'], maxLength: 300 }
        pagado: { type: boolean, default: true, description: 'false: queda Sin pagar (se cobra con un link)' }
    Devolucion:
      type: object
      required: [id, producto, foto, cliente, pedido, creada, motivo, monto, resolucion, estado]
      properties:
        id: { type: string }
        producto: { type: string }
        foto: { type: [string, 'null'] }
        cliente: { type: string }
        pedido: { type: integer }
        creada: { type: string, format: date-time }
        motivo: { type: string }
        monto: { type: integer }
        resolucion: { type: string, description: 'Lo que pidió: reintegro, reemplazo, cambio' }
        estado: { type: string, enum: [Pendiente, Aprobada, Cambio ofrecido] }
    ResenasYPreguntas:
      type: object
      required: [preguntas, resenas, promedio, total, porEstrellas, recomendaria]
      properties:
        preguntas:
          type: array
          items:
            type: object
            required: [id, producto, foto, pregunta, creada, sugerida, respuesta]
            properties:
              id: { type: string, description: 'Las de la tienda online empiezan con "t-"; las demás son de Mercado Libre' }
              producto: { type: string }
              foto: { type: [string, 'null'] }
              pregunta: { type: string }
              creada: { type: string, format: date-time }
              sugerida: { type: string, description: 'La respuesta que propone Hornero' }
              respuesta: { type: [string, 'null'], description: 'La publicada' }
        resenas:
          type: array
          items:
            type: object
            required: [id, autor, estrellas, texto, origen, creada, producto, conCompra, oculta, respuesta]
            properties:
              id: { type: string }
              autor: { type: string }
              estrellas: { type: integer }
              texto: { type: string }
              origen: { type: string, description: 'Tienda, Mercado Libre, Google' }
              creada: { type: string, format: date-time }
              producto: { type: [string, 'null'], description: 'El producto reseñado (si sigue existiendo)' }
              conCompra: { type: boolean, description: 'La dejó quien compró: trajo el código de un pedido cobrado' }
              oculta: { type: boolean, description: 'La tienda la ocultó (no se borra)' }
              respuesta: { type: [string, 'null'], description: 'La respuesta pública de la tienda' }
        promedio: { type: [number, 'null'] }
        total: { type: integer }
        porEstrellas: { type: array, items: { type: integer }, description: 'De 5 a 1 estrella' }
        recomendaria: { type: integer, description: 'Porcentaje (4 y 5 estrellas)' }
    LinkPublico:
      type: object
      required: [codigo, tienda, concepto, monto, cuotas, pagado, pedido]
      properties:
        codigo: { type: string }
        tienda: { type: string }
        concepto: { type: string }
        monto: { type: integer }
        cuotas: { type: boolean }
        pagado: { type: boolean }
        pedido: { type: [integer, 'null'] }
    ListasPrecio:
      type: object
      required: [listas, productos, muestra, programado]
      properties:
        listas:
          type: array
          items:
            type: object
            required: [id, nombre, quien, ajuste, detalle]
            properties:
              id: { type: string, enum: [minorista, mayorista, ml, revendedoras] }
              nombre: { type: string }
              quien: { type: string }
              ajuste: { type: integer, description: 'Porcentaje sobre el precio base (0 = base)' }
              detalle: { type: string }
        productos: { type: integer, description: 'Cuántos productos toca un aumento' }
        muestra:
          type: array
          items:
            type: object
            required: [id, nombre, precio]
            properties:
              id: { type: string }
              nombre: { type: string }
              precio: { type: integer }
        programado:
          type: [object, 'null']
          required: [pct, redondeo, para]
          properties:
            pct: { type: integer }
            redondeo: { type: string, enum: ['no', '90', '500'] }
            para: { type: string, format: date-time }
    Cupon:
      type: object
      required: [id, codigo, tipo, valor, descripcion, estado, usos, limite, vendio, desconto, canales, empieza, termina, minimo, consejo, creado]
      properties:
        id: { type: string }
        codigo: { type: string }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, description: 'Porcentaje o pesos (0 en envío y regalo)' }
        descripcion: { type: string }
        estado: { type: string, enum: [activo, programado, pausado, terminado] }
        usos: { type: integer }
        limite: { type: integer, description: '0 = sin límite' }
        vendio: { type: integer }
        desconto: { type: integer }
        canales: { type: array, items: { type: string, enum: [web, wa, ig, pos] } }
        empieza: { type: [string, 'null'], format: date-time }
        termina: { type: [string, 'null'], format: date-time }
        minimo: { type: integer }
        consejo: { type: [string, 'null'], description: 'Lo que sugiere Hornero' }
        creado: { type: string, format: date-time }
    CuponNuevo:
      type: object
      required: [codigo, tipo, valor, alcance, quien, minimo, limite, porCliente, vigencia, canales, opciones]
      properties:
        codigo: { type: string, pattern: '^[A-Z0-9-]{3,20}$' }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, minimum: 0, maximum: 100000 }
        alcance: { type: string, enum: [todo, categoria, productos] }
        productos: { type: array, maxItems: 50, items: { type: string } }
        quien: { type: string, enum: [todos, nuevos, vip, riesgo] }
        minimo: { type: integer, minimum: 0 }
        limite: { type: integer, minimum: 0 }
        porCliente: { type: string, enum: ['1', '3', libre] }
        vigencia: { type: string, enum: ['7', finde, '30', hotsale, sin] }
        canales: { type: array, minItems: 1, items: { type: string, enum: [web, wa, ig, pos] } }
        opciones:
          type: object
          required: [hornero, combinable, unicos, link]
          properties:
            hornero: { type: boolean }
            combinable: { type: boolean }
            unicos: { type: boolean }
            link: { type: boolean }
        programar: { type: boolean, default: false }
    Automatica:
      type: object
      required: [id, titulo, detalle, ejemplo, estado, aporte, activa]
      properties:
        id: { type: string, enum: [transf, envio, cantidad, '3x2', cuotas, mayorista, carrito, cumple] }
        titulo: { type: string }
        detalle: { type: string }
        ejemplo: { type: string }
        estado: { type: string }
        aporte: { type: [integer, 'null'], description: 'Lo que vendió con esta promo este mes' }
        activa: { type: boolean }
    Cupones:
      type: object
      required: [cupones, kpis, consejo, segmentos, automaticas, relampago, tienda, productos, categoria]
      properties:
        cupones: { type: array, items: { $ref: '#/components/schemas/Cupon' } }
        kpis:
          type: object
          required: [activos, usosMes, vendido, descontado, vsMesAnterior]
          properties:
            activos: { type: integer }
            usosMes: { type: integer }
            vendido: { type: integer }
            descontado: { type: integer }
            vsMesAnterior: { type: [integer, 'null'], description: 'Porcentaje' }
        consejo:
          type: [object, 'null']
          required: [cuponId, codigo, titulo, texto, minimo]
          properties:
            cuponId: { type: string }
            codigo: { type: string }
            titulo: { type: string }
            texto: { type: string }
            minimo: { type: integer }
        segmentos:
          type: object
          required: [vip, riesgo]
          properties:
            vip: { type: integer }
            riesgo: { type: integer }
        automaticas: { type: array, items: { $ref: '#/components/schemas/Automatica' } }
        relampago:
          type: object
          required: [vivo, proximas]
          properties:
            vivo:
              type: [object, 'null']
              required: [producto, foto, pct, precio, oferta, termina, vendidos, unidades, terminada]
              properties:
                producto: { type: string }
                foto: { type: [string, 'null'] }
                pct: { type: integer }
                precio: { type: integer }
                oferta: { type: integer }
                termina: { type: string, format: date-time }
                vendidos: { type: integer }
                unidades: { type: integer }
                terminada: { type: boolean }
            proximas:
              type: array
              items:
                type: object
                required: [titulo, detalle, cuando, foto]
                properties:
                  titulo: { type: string }
                  detalle: { type: string }
                  cuando: { type: string }
                  foto: { type: [string, 'null'] }
        tienda: { type: string }
        productos:
          type: array
          description: Para elegir a qué productos aplica
          items:
            type: object
            required: [id, nombre, foto]
            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        categoria: { type: [string, 'null'], description: 'La categoría que más vende (alcance "una categoría")' }
    Campana:
      type: object
      required: [id, canal, titulo, detalle, estado, metricas]
      properties:
        id: { type: string }
        canal: { type: string, enum: [wa, email] }
        titulo: { type: string }
        detalle: { type: string }
        estado: { type: string, enum: [Enviando, Programada, Activa, Terminada] }
        metricas:
          type: array
          items:
            type: object
            required: [k, v]
            properties:
              k: { type: string }
              v: { type: string }
    Marketing:
      type: object
      required: [tienda, audiencias, costoMensaje, retorno, mensajes, producto, cupon, campanas, cupones]
      properties:
        tienda:
          type: object
          required: [nombre, foto]
          properties:
            nombre: { type: string }
            foto: { type: [string, 'null'] }
        audiencias:
          type: array
          items:
            type: object
            required: [id, nombre, cantidad]
            properties:
              id: { type: string, enum: [todos, vip, riesgo, categoria] }
              nombre: { type: string }
              cantidad: { type: integer }
        costoMensaje: { type: integer, description: 'Pesos por mensaje de marketing de WhatsApp' }
        retorno: { type: [number, 'null'], description: 'Ventas por cada peso, según campañas anteriores' }
        mensajes: { type: array, items: { type: string }, description: 'Lo que propone Hornero; {nombre} se reemplaza' }
        producto:
          type: [object, 'null']
          required: [nombre, foto]
          properties:
            nombre: { type: string }
            foto: { type: [string, 'null'] }
        cupon: { type: [string, 'null'], description: 'El cupón que se puede adjuntar' }
        campanas: { type: array, items: { $ref: '#/components/schemas/Campana' } }
        cupones:
          type: array
          items:
            type: object
            required: [codigo, descripcion, usos]
            properties:
              codigo: { type: string }
              descripcion: { type: string }
              usos: { type: string }
    Canales:
      type: object
      required: [mes, canales]
      properties:
        mes: { type: string }
        canales:
          type: array
          items:
            type: object
            required: [id, nombre, vendido, pedidos, comision, nota, activo, conectado]
            properties:
              id: { type: string, enum: [web, wa, ml, pos, ig, tg, gg, tk] }
              nombre: { type: string }
              vendido: { type: integer }
              pedidos: { type: integer }
              comision: { type: number, description: '0,14 = 14 %' }
              nota: { type: string }
              activo: { type: boolean }
              conectado: { type: boolean }
    Informes:
      type: object
      required: [meses, series, kpis, historia, insights]
      properties:
        meses: { type: array, items: { type: string } }
        series:
          type: object
          required: [ventas, productos, clientes, margen]
          properties:
            ventas: { type: array, items: { type: integer } }
            productos: { type: array, items: { type: integer } }
            clientes: { type: array, items: { type: integer } }
            margen: { type: array, items: { type: [integer, 'null'] } }
        kpis:
          type: object
          required: [ventas, ventasVs, ticket, ticketVs, margen, margenVs, ahorro, mesAnterior]
          properties:
            ventas: { type: integer }
            ventasVs: { type: [number, 'null'] }
            ticket: { type: integer }
            ticketVs: { type: [number, 'null'] }
            margen: { type: [integer, 'null'] }
            margenVs: { type: [integer, 'null'] }
            ahorro: { type: integer, description: 'Comisiones que no pagó contra una plataforma con comisión' }
            mesAnterior: { type: string }
        historia: { type: integer, description: 'Meses de historia' }
        insights: { type: array, items: { type: string } }
    Evento:
      type: object
      required: [id, tipo, quien, foto, texto, cuando, donde, deshacer, deshecho]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [equipo, hornero, sistema] }
        quien: { type: string }
        foto: { type: [string, 'null'] }
        texto: { type: string }
        cuando: { type: string, format: date-time }
        donde: { type: string }
        deshacer: { type: boolean, description: 'Se puede volver atrás' }
        deshecho: { type: boolean }
    ParaHacer:
      type: object
      required: [grupos]
      properties:
        grupos:
          type: array
          items:
            type: object
            required: [titulo, tareas]
            properties:
              titulo: { type: string, enum: [Urgente, Hoy, Esta semana] }
              tareas:
                type: array
                items:
                  type: object
                  required: [id, tipo, titulo, detalle, valor, accion, hecha]
                  properties:
                    id: { type: string }
                    tipo: { type: string, enum: [preparar, chats, carritos, transferencias, certificado, reponer] }
                    titulo: { type: string }
                    detalle: { type: string }
                    valor: { type: [integer, 'null'], description: 'Lo que mueve, en pesos' }
                    aproximado: { type: boolean }
                    accion: { type: string }
                    hecha: { type: boolean }
    Finanzas:
      type: object
      required: [disponible, cuenta, banco, caja, kpis, flujo, movimientos, conciliado]
      properties:
        disponible: { type: integer, description: 'En Mercado Pago, listo para transferir' }
        cuenta: { type: [string, 'null'], description: 'Cómo se muestra la cuenta de cobro (CBU terminada en…)' }
        banco: { type: [string, 'null'] }
        caja:
          type: [object, 'null']
          description: null si Caja no está conectada
          required: [ventas, liquidaciones, gastos, meta, metaPct, falta, sincronizado]
          properties:
            ventas: { type: integer }
            liquidaciones: { type: integer }
            gastos: { type: integer }
            meta: { type: string }
            metaPct: { type: integer }
            falta: { type: integer }
            sincronizado: { type: string, format: date-time }
        kpis:
          type: object
          required: [aLiquidar, aLiquidarDetalle, gastos, gastosDetalle, ganancia, gananciaDetalle, margen, mes]
          properties:
            aLiquidar: { type: integer }
            aLiquidarDetalle: { type: string }
            gastos: { type: integer }
            gastosDetalle: { type: string }
            ganancia: { type: [integer, 'null'], description: 'null si a algo vendido le falta el costo (no se estima)' }
            gananciaDetalle: { type: string, description: 'Por qué no hay ganancia ("Falta el costo de 2 productos vendidos"); vacío si la hay' }
            margen: { type: [integer, 'null'] }
            mes: { type: string }
        flujo:
          type: array
          description: Próximos 14 días
          items:
            type: object
            required: [dia, entra, sale]
            properties:
              dia: { type: integer }
              entra: { type: integer }
              sale: { type: integer }
        movimientos:
          type: array
          items:
            type: object
            required: [id, tipo, titulo, detalle, monto]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [mp, payway, modo, uala, andreani, oca, correo, moto, transf, gasto, retiro] }
              titulo: { type: string }
              detalle: { type: string }
              monto: { type: integer, description: 'Positivo entra, negativo sale' }
        conciliado: { type: boolean }
    DisenoTienda:
      type: object
      required: [secciones, paleta]
      properties:
        secciones:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [id, visible]
            properties:
              id: { type: string, enum: [hero, cats, prods, revs, ig, wa] }
              visible: { type: boolean }
        paleta: { type: integer, minimum: 0, maximum: 3 }
    Tarjeta:
      type: object
      description: 'La tarjeta A6 para los paquetes (pieza 7a de Imprimibles). Los textos aceptan {nombre}, {fecha}, {productos} y {pedido}'
      required: [modelo, titulo, mensaje, dorsoTitulo, dorsoTexto, qr, cupon, instagram]
      properties:
        modelo: { type: string, enum: [arco, sello, carta] }
        titulo: { type: string, minLength: 1, maxLength: 40 }
        mensaje: { type: string, maxLength: 140 }
        dorsoTitulo: { type: string, maxLength: 40 }
        dorsoTexto: { type: string, maxLength: 140 }
        qr: { type: string, enum: [resena, cupon, instagram, whatsapp] }
        cupon: { type: string, pattern: '^[A-Z0-9-]{0,20}$' }
        instagram: { type: string, pattern: '^[a-zA-Z0-9._]{0,30}$' }
    MiTienda:
      type: object
      required: [plantilla, direccion, diseno, sinPublicar, vista]
      properties:
        plantilla: { type: string }
        direccion: { type: string, description: 'Dónde se ve la tienda (dominio o dirección de Tu Local Web)' }
        diseno: { $ref: '#/components/schemas/DisenoTienda' }
        sinPublicar: { type: boolean }
        vista:
          type: object
          required: [tienda, categorias, productos, resena, fotos, portada]
          properties:
            tienda: { type: string }
            categorias: { type: array, items: { type: string } }
            productos:
              type: array
              items:
                type: object
                required: [nombre, foto, precio]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  precio: { type: integer }
            resena:
              type: [object, 'null']
              required: [promedio, texto]
              properties:
                promedio: { type: number }
                texto: { type: string }
            fotos: { type: array, items: { type: string } }
            portada:
              type: object
              required: [foto, titulo]
              properties:
                foto: { type: [string, 'null'] }
                titulo: { type: string }
    Negocio:
      type: object
      required: [nombre, razonSocial, cuit, condicion, direccion, whatsapp, email, horario]
      properties:
        nombre: { type: string, maxLength: 80 }
        razonSocial: { type: string, maxLength: 120 }
        cuit: { type: string, maxLength: 13 }
        condicion: { type: string, maxLength: 60 }
        direccion: { type: string, maxLength: 160 }
        whatsapp: { type: string, maxLength: 30 }
        email: { type: string, maxLength: 120 }
        horario: { type: string, maxLength: 80 }
        alias: { type: string, maxLength: 20, pattern: '^([a-zA-Z0-9.-]{6,20})?$', description: 'Alias para cobrar por transferencia (6 a 20 caracteres; vacío si no hay)' }
        cbu: { type: string, maxLength: 22, pattern: '^([0-9]{22})?$', description: 'CBU o CVU de 22 dígitos, con sus verificadores (vacío si no hay)' }
        titular: { type: string, maxLength: 80 }
    Miembro:
      type: object
      required: [id, nombre, contacto, rol, foto, ultimo, pendiente, vos, dobleFactor]
      properties:
        id: { type: string }
        nombre: { type: string }
        contacto: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, deposito] }
        foto: { type: [string, 'null'] }
        ultimo: { type: [string, 'null'], format: date-time }
        pendiente: { type: boolean, description: 'Invitación sin aceptar' }
        vos: { type: boolean }
        dobleFactor: { type: boolean }
    Configuracion:
      type: object
      required: [negocio, equipo, seguridad, sesiones, avisos, plan]
      properties:
        negocio: { $ref: '#/components/schemas/Negocio' }
        equipo: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
        seguridad:
          type: object
          required: [dobleFactor, otroPais, alertas, inactivas]
          properties:
            dobleFactor: { type: boolean }
            otroPais: { type: boolean }
            alertas: { type: boolean }
            inactivas: { type: boolean }
        sesiones:
          type: array
          items:
            type: object
            required: [id, tipo, nombre, donde, cuando, actual]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [compu, celu, caja] }
              nombre: { type: string }
              donde: { type: string }
              cuando: { type: string, format: date-time }
              actual: { type: boolean }
        avisos:
          type: object
          required: [venta, chats, stock, diario, ideas, novedades]
          properties:
            venta: { type: boolean }
            chats: { type: boolean }
            stock: { type: boolean }
            diario: { type: boolean }
            ideas: { type: boolean }
            novedades: { type: boolean }
        plan:
          type: object
          required: [actual, ciclo, enPrueba, diasPrueba]
          properties:
            actual: { type: string, enum: [gratis, emprende, pro, negocio] }
            ciclo: { type: string, enum: [mes, anio] }
            enPrueba: { type: boolean }
            diasPrueba: { type: integer }
    PlanCuenta:
      type: object
      required: [actual, ciclo, enPrueba, diasPrueba, proximoCobro, uso, medio, facturacion, facturas, cancelado]
      properties:
        actual: { type: string, enum: [gratis, emprende, pro, negocio] }
        ciclo: { type: string, enum: [mes, anio] }
        enPrueba: { type: boolean }
        diasPrueba: { type: integer }
        proximoCobro: { type: string, format: date-time }
        uso:
          type: object
          required: [productos, personas, hornero, packs, sinIa]
          properties:
            productos: { type: integer }
            personas: { type: integer }
            hornero: { type: integer, description: 'Respuestas con IA este mes' }
            packs: { type: integer }
            sinIa: { type: integer }
        medio:
          type: [object, 'null']
          required: [marca, ultimos, vence]
          properties:
            marca: { type: string }
            ultimos: { type: string }
            vence: { type: string }
        facturacion:
          type: object
          required: [razonSocial, cuit, tipo]
          properties:
            razonSocial: { type: string }
            cuit: { type: string }
            tipo: { type: string }
        facturas:
          type: array
          items:
            type: object
            required: [numero, detalle, total]
            properties:
              numero: { type: string }
              detalle: { type: string }
              total: { type: integer }
        cancelado:
          type: [object, 'null']
          required: [hasta]
          properties:
            hasta: { type: string, format: date-time }
    Permisos:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items:
            type: object
            required: [id, titulo, detalle, roles]
            properties:
              id: { type: string }
              titulo: { type: string }
              detalle: { type: string }
              roles:
                type: object
                required: [duenio, admin, ventas, deposito]
                properties:
                  duenio: { type: boolean }
                  admin: { type: boolean }
                  ventas: { type: boolean }
                  deposito: { type: boolean }
    UrlExterna:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Medicion:
      type: object
      required: [ga4, pixel, feeds]
      properties:
        ga4: { type: [string, 'null'], pattern: '^(G-[A-Z0-9]{6,12})?$', description: 'ID de medición de GA4' }
        pixel: { type: [string, 'null'], pattern: '^([0-9]{15,16})?$', description: 'ID del píxel de Meta' }
        feeds:
          type: object
          required: [gm, meta]
          properties:
            gm: { type: boolean, description: 'Cargó el feed en Google Merchant Center' }
            meta: { type: boolean, description: 'Cargó el feed en Meta Commerce Manager' }
    ConexionML:
      type: object
      required: [disponible, conectada, reautorizar, recargo, pausarSinStock, publicaciones, preguntas]
      properties:
        disponible: { type: boolean }
        conectada: { type: boolean }
        apodo: { type: string }
        desde: { type: string, format: date-time }
        reautorizar: { type: boolean }
        recargo: { type: integer }
        pausarSinStock: { type: boolean }
        publicaciones: { type: integer }
        preguntas: { type: integer, description: 'Sin responder' }
    PublicacionML:
      type: object
      required: [itemId, permalink]
      properties:
        itemId: { type: string }
        permalink: { type: string }
    ArcaConfig:
      type: object
      required: [conectada, cuit, razonSocial, condicion, puntoVenta, ambiente, certificado, certificadoVence, facturarAlCobrar]
      properties:
        conectada: { type: boolean, description: 'Tiene certificado cargado' }
        cuit: { type: string, description: '11 dígitos; vacío si nunca se configuró' }
        razonSocial: { type: string, maxLength: 64 }
        condicion: { type: string, description: 'monotributo | responsable_inscripto (vacío si nunca se configuró)' }
        puntoVenta: { type: integer, minimum: 0, maximum: 99998 }
        ambiente: { type: string, enum: [homologacion, produccion] }
        certificado: { type: boolean }
        certificadoVence: { type: [string, 'null'], format: date-time }
        facturarAlCobrar: { type: boolean }
    ArcaAlta:
      type: object
      required: [cuit, razonSocial, condicion, puntoVenta, ambiente]
      properties:
        cuit: { type: string, minLength: 11, maxLength: 13, description: 'Con o sin guiones; se valida el dígito verificador' }
        razonSocial: { type: string, minLength: 1, maxLength: 64 }
        condicion: { type: string, enum: [monotributo, responsable_inscripto] }
        puntoVenta: { type: integer, minimum: 1, maximum: 99998 }
        ambiente: { type: string, enum: [homologacion, produccion] }
    ArcaCertificado:
      type: object
      required: [cuit, alias, desde, vence, emisor, homologacion]
      properties:
        cuit: { type: string }
        alias: { type: string }
        desde: { type: string, format: date-time }
        vence: { type: string, format: date-time }
        emisor: { type: string }
        homologacion: { type: boolean }
    ConexionMP:
      type: object
      required: [disponible, conectada, reautorizar, cajaQR]
      properties:
        disponible: { type: boolean, description: 'La aplicación de Tu Local Web tiene credenciales' }
        conectada: { type: boolean }
        usuario: { type: string, description: 'user_id de la cuenta de Mercado Pago' }
        desde: { type: string, format: date-time }
        reautorizar: { type: boolean, description: 'El refresh falló: hay que volver a conectar' }
        cajaQR: { type: boolean }
    UbicacionMP:
      type: object
      required: [calle, numero, ciudad, provincia, latitud, longitud]
      properties:
        calle: { type: string, maxLength: 120 }
        numero: { type: string, maxLength: 20 }
        ciudad: { type: string, maxLength: 80 }
        provincia: { type: string, maxLength: 80 }
        latitud: { type: number }
        longitud: { type: number }
    CobroQR:
      type: object
      required: [referencia, qr, estado]
      properties:
        referencia: { type: string }
        qr: { type: string, description: 'qr_data para dibujar' }
        estado: { type: string }
    Dominios:
      type: object
      required: [gratis, dominios, registros]
      properties:
        gratis: { type: string, description: 'La dirección que viene con la tienda' }
        dominios:
          type: array
          items:
            type: object
            required: [nombre, detalle, estado, principal]
            properties:
              nombre: { type: string }
              detalle: { type: string }
              estado: { type: string, enum: [activo, verificando] }
              principal: { type: boolean }
              chequeos:
                type: array
                items:
                  type: object
                  required: [titulo, estado]
                  properties:
                    titulo: { type: string }
                    estado: { type: string, enum: [ok, esperando, pendiente] }
        registros:
          type: array
          items:
            type: object
            required: [tipo, nombre, valor]
            properties:
              tipo: { type: string }
              nombre: { type: string }
              valor: { type: string }
    PreferenciasAvisos:
      type: object
      required: [matriz, silencio, resumen]
      properties:
        matriz:
          type: object
          description: '"aviso:canal" → activo (los que no están, van por defecto)'
          additionalProperties: { type: boolean }
        silencio: { type: boolean }
        resumen: { type: string, enum: [whatsapp, email, off] }
    MisDatos:
      type: object
      required: [conteos, recientes, inactivos, borrado]
      properties:
        conteos:
          type: object
          required: [productos, clientes, pedidos, facturas, resenas, conversaciones]
          properties:
            productos: { type: integer }
            clientes: { type: integer }
            pedidos: { type: integer }
            facturas: { type: integer }
            resenas: { type: integer }
            conversaciones: { type: integer }
        recientes:
          type: array
          items:
            type: object
            required: [tipo, formato, en]
            properties:
              tipo: { type: string }
              formato: { type: string }
              en: { type: string, format: date-time }
        inactivos: { type: integer }
        borrado:
          type: [object, 'null']
          required: [clientes, el]
          properties:
            clientes: { type: integer }
            el: { type: string, format: date-time }
    Tablero:
      type: object
      required: [periodo, desde, hasta, hola, ventas, serie, kpis, canales, meta, avisos, ultimosPedidos, paraHacer, enVivo, caja, liquidaciones, hornero, bandeja, integraciones, masVendidos, resenas, envios]
      properties:
        periodo: { type: string, enum: [hoy, 7d, 30d] }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        hola: { type: [string, 'null'], description: 'Nombre de pila de quien entra' }
        ventas: { $ref: '#/components/schemas/Comparado' }
        serie:
          type: object
          description: 'Ventas acumuladas en 14 tramos del período, y las del período anterior'
          required: [actual, anterior]
          properties:
            actual: { type: array, items: { type: number } }
            anterior: { type: array, items: { type: number } }
        kpis:
          type: object
          required: [pedidos, ticket, conversion, clientesNuevos]
          properties:
            pedidos: { $ref: '#/components/schemas/Comparado' }
            ticket: { $ref: '#/components/schemas/Comparado' }
            conversion: { $ref: '#/components/schemas/Comparado', description: 'Porcentaje (3.4 = 3,4 %)' }
            clientesNuevos: { $ref: '#/components/schemas/Comparado' }
        canales:
          type: array
          description: 'Parte de las ventas del período por canal (web, wa, ml, ig, pos, tg), de mayor a menor'
          items:
            type: object
            required: [canal, parte]
            properties:
              canal: { type: string }
              parte: { type: number, description: 'De 0 a 1' }
        meta:
          type: object
          required: [objetivo, actual, proyeccion]
          properties:
            objetivo: { type: integer, description: '0: sin meta' }
            actual: { type: integer, description: 'Vendido en el mes' }
            proyeccion: { type: integer, description: 'Al ritmo actual, cómo cierra el mes' }
        avisos:
          type: object
          required: [certificadoDias]
          properties:
            certificadoDias: { type: [integer, 'null'], description: 'Días para que venza el certificado de ARCA, si hay que avisar' }
        ultimosPedidos:
          type: array
          items: { $ref: '#/components/schemas/PedidoBreve' }
        paraHacer:
          type: object
          required: [preparar, chats, chatMasViejoMin, transferencias, transferenciasMonto, sinStock, sinStockEnMl]
          properties:
            preparar: { type: integer }
            chats: { type: integer }
            chatMasViejoMin: { type: integer }
            transferencias: { type: integer }
            transferenciasMonto: { type: integer }
            sinStock: { type: integer }
            sinStockEnMl: { type: integer }
        enVivo:
          type: object
          required: [personas, paginas, carritos, carritosMonto]
          properties:
            personas: { type: integer }
            paginas:
              type: array
              items:
                type: object
                required: [nombre, personas]
                properties:
                  nombre: { type: string }
                  personas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
        caja:
          type: object
          required: [abierta, total, medios]
          properties:
            abierta: { type: [string, 'null'], format: date-time, description: 'Cuándo se abrió hoy (null: cerrada)' }
            total: { type: integer }
            medios:
              type: array
              items:
                type: object
                required: [medio, monto]
                properties:
                  medio: { type: string, description: 'efectivo, tarjeta, mp, modo, transf' }
                  monto: { type: integer }
        liquidaciones:
          type: array
          description: 'Lo que se acredita en los próximos 7 días, por medio de pago'
          items:
            type: object
            required: [medio, fecha, monto]
            properties:
              medio: { type: string }
              fecha: { type: string, format: date }
              monto: { type: integer }
        hornero:
          type: object
          required: [chatsHoy, ideas, carritos, carritosMonto, costoMensaje, recordados, audiencia, ideasHechas]
          properties:
            chatsHoy: { type: integer }
            ideas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
            costoMensaje: { type: integer, description: 'Lo que cuesta cada mensaje de WhatsApp' }
            recordados: { type: boolean, description: 'Ya se les mandó el recordatorio' }
            audiencia: { type: integer, description: 'Clientes que aceptan mensajes por WhatsApp' }
            ideasHechas:
              type: array
              description: 'Ideas de Hornero ya aprobadas (carritos, stock, promo)'
              items: { type: string }
        bandeja:
          type: array
          items:
            type: object
            required: [nombre, foto, mensaje, creado, atiende, sinLeer]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'], description: 'Id de la foto en Unsplash' }
              mensaje: { type: string }
              creado: { type: string, format: date-time }
              atiende: { type: string, enum: [hornero, vos] }
              sinLeer: { type: integer }
        integraciones:
          type: array
          description: 'Integraciones conectadas con su dato del momento'
          items:
            type: object
            required: [id, valor]
            properties:
              id: { type: string, description: 'mp (cobrado en 7 días), ml (publicaciones), wa (chats esperando), arca (días del certificado), andreani (envíos en camino)' }
              valor: { type: integer }
        masVendidos:
          type: array
          description: 'Los 4 más vendidos de los últimos 7 días'
          items:
            type: object
            required: [productoId, nombre, foto, unidades]
            properties:
              productoId: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              unidades: { type: integer }
        resenas:
          type: object
          required: [promedio, nuevas]
          properties:
            promedio: { type: [number, 'null'] }
            nuevas:
              type: array
              items:
                type: object
                required: [texto, autor, producto, canal, estrellas]
                properties:
                  texto: { type: string }
                  autor: { type: string }
                  producto: { type: string }
                  canal: { type: string }
                  estrellas: { type: integer }
        envios:
          type: object
          required: [paquetes, retiros]
          properties:
            paquetes: { type: integer }
            retiros:
              type: array
              items:
                type: object
                required: [hora, transporte, paquetes, ciudad, proximo]
                properties:
                  hora: { type: string, description: 'HH:MM' }
                  transporte: { type: string, enum: [andreani, oca, correo, moto] }
                  paquetes: { type: integer }
                  ciudad: { type: [string, 'null'], description: 'Si todos van a la misma ciudad' }
                  proximo: { type: boolean }
    EstadoPedido:
      type: string
      enum: [Sin pagar, Para preparar, Listo para despachar, En camino, Entregado, Cancelado]
    PedidoFila:
      type: object
      required: [numero, cliente, foto, ciudad, canal, pago, envio, estado, total, creado, productos, cantidadProductos, vip, hornero, mayorista]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        ciudad: { type: string }
        canal: { type: string }
        pago: { type: string, description: 'mp, tarjeta, payway, modo, uala, transf, efectivo' }
        envio: { type: string, description: 'andreani, oca, correo, moto, retiro' }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
        productos:
          type: array
          description: 'Los primeros 3'
          items:
            type: object
            required: [nombre, foto]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        cantidadProductos: { type: integer }
        vip: { type: boolean }
        hornero: { type: boolean, description: 'Lo vendió Hornero' }
        mayorista: { type: boolean }
    ListaPedidos:
      type: object
      required: [total, suma, filas, etapas, facetas]
      properties:
        total: { type: integer, description: 'Pedidos que cumplen los filtros' }
        suma: { type: integer }
        filas: { type: array, items: { $ref: '#/components/schemas/PedidoFila' } }
        etapas:
          type: object
          description: 'Por estado, con todos los filtros salvo el de estado'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Conteos de canal, pago y envío; cada uno sin su propio filtro'
          required: [canal, pago, envio]
          properties:
            canal: { type: object, additionalProperties: { type: integer } }
            pago: { type: object, additionalProperties: { type: integer } }
            envio: { type: object, additionalProperties: { type: integer } }
    PedidoDetalle:
      allOf:
        - { $ref: '#/components/schemas/PedidoFila' }
        - type: object
          required: [items, subtotal, costoEnvio, descuentos, comprador, estadoPago, factura, seguimiento, llega, nota, entrega, historial]
          properties:
            items:
              type: array
              items:
                type: object
                required: [nombre, foto, cantidad, precio, varianteId, variante]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  cantidad: { type: integer }
                  precio: { type: integer }
                  varianteId: { type: [string, 'null'] }
                  variante: { type: [string, 'null'], description: 'Texto de la variante al comprar: "Talle M · Color Negro"' }
            subtotal: { type: integer }
            costoEnvio: { type: integer }
            descuentos:
              type: array
              description: 'Cada descuento por separado (cupón, transferencia): subtotal + envío − descuentos = total'
              items:
                type: object
                required: [concepto, monto]
                properties:
                  concepto: { type: string, description: '"Cupón VERANO10", "Descuento por transferencia"' }
                  monto: { type: integer }
            comprador:
              type: object
              required: [nombre, foto, telefono, email, desde, pedidos, gastado]
              properties:
                nombre: { type: string }
                foto: { type: [string, 'null'] }
                telefono: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
                desde: { type: string, format: date-time }
                pedidos: { type: integer }
                gastado: { type: integer }
            estadoPago: { type: string, description: 'Aprobado, Acreditada, Pendiente, Cobrado' }
            factura: { type: [string, 'null'], description: 'B 0004-00000812' }
            seguimiento: { type: [string, 'null'] }
            llega: { type: [string, 'null'], format: date }
            nota: { type: [string, 'null'], description: 'Lo que anotó Hornero de la charla' }
            entrega:
              type: [object, 'null']
              description: 'Adónde se manda (para la etiqueta); null si retira o no se cargó'
              required: [direccion, cp]
              properties:
                direccion: { type: string }
                cp: { type: string }
            historial:
              type: array
              items:
                type: object
                required: [texto, cuando, hecho]
                properties:
                  texto: { type: string }
                  cuando: { type: [string, 'null'], format: date-time }
                  hecho: { type: boolean }
    PedidoBreve:
      type: object
      required: [numero, cliente, foto, canal, estado, total, creado]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
    Notificacion:
      type: object
      required: [id, tipo, titulo, detalle, creada, leida, grupo]
      properties:
        id: { type: string }
        tipo: { type: string, description: 'Marca o tipo del ícono: wa, mp, ml, warn, arca, star, ok, err' }
        titulo: { type: string }
        detalle: { type: string }
        creada: { type: string, format: date-time }
        leida: { type: boolean }
        grupo: { type: string, enum: [ventas, sistema] }
    Onboarding:
      type: object
      required: [elecciones]
      properties:
        plantilla: { type: string, description: 'Una de las 16 del handoff' }
        elecciones: { type: object, additionalProperties: true, description: 'Objetivos, canales, secciones, cobros y envíos, tono, equipo (hasta 16 KB)' }
        terminado: { type: boolean }
    Consulta:
      type: object
      required: [nombre, email]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        whatsapp: { type: string, description: 'Con característica; se guardan sólo los dígitos' }
        web: { type: string, maxLength: 200 }
        facturacion: { type: string, enum: [empiezo, hasta-5, 5-a-20, 20-a-100, mas-de-100] }
        origen: { type: string, enum: [tiendanube, empretienda, mercadolibre, shopify, woocommerce, ninguna] }
        mensaje: { type: string, maxLength: 2000 }
    Postulacion:
      type: object
      required: [nombre, email, agencia]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        agencia: { type: string, maxLength: 120 }
        web: { type: string, maxLength: 200 }
        especialidades:
          type: array
          items: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    NivelPartner: { type: string, enum: [partner, plata, oro] }
    EspecialidadPartner: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    PerfilPartner:
      type: object
      required: [nombre, ciudad, descripcion, especialidades, casos, email, whatsapp, web, logo]
      properties:
        nombre: { type: string, maxLength: 80 }
        ciudad: { type: string, maxLength: 60 }
        descripcion: { type: string, maxLength: 280 }
        especialidades: { type: array, items: { $ref: '#/components/schemas/EspecialidadPartner' } }
        casos:
          type: array
          maxItems: 6
          items:
            type: object
            required: [nombre, url]
            properties:
              nombre: { type: string, maxLength: 60 }
              url: { type: string, description: 'https://' }
        email: { type: string }
        whatsapp: { type: string, description: 'Sólo dígitos, con característica' }
        web: { type: string, description: 'https:// o vacío' }
        logo: { type: string, description: 'URL https:// de la imagen, o vacío' }
    CobroPartner:
      type: object
      required: [tipo, valor, titular, cuit, condicionIva]
      properties:
        tipo: { type: string, enum: [cbu, alias], description: 'CBU/CVU (22 dígitos con verificadores) o alias de Mercado Pago o del banco' }
        valor: { type: string }
        titular: { type: string, maxLength: 80 }
        cuit: { type: string, description: '11 dígitos con verificador' }
        condicionIva: { type: string, enum: [monotributo, responsable_inscripto, exento] }
    TiendaReferida:
      type: object
      required: [id, nombre, slug, plan, ciclo, estado, alta, finComision, comisionMes]
      properties:
        id: { type: string }
        nombre: { type: string }
        slug: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        ciclo: { type: string, enum: [mes, anio] }
        estado: { type: string, enum: [prueba, activa, gratis, baja] }
        alta: { type: string, format: date }
        finComision: { type: string, format: date, description: 'Primer día del mes en que deja de generar comisión (12 meses desde el alta)' }
        comisionMes: { type: integer, description: 'En pesos: % del nivel sobre lo que paga por mes; 0 si no está activa o pasaron los 12 meses' }
    PagoPartner:
      type: object
      required: [mes, estado, monto, detalle, facturaUrl, fechaPago, pagadoEn]
      properties:
        mes: { type: string, description: 'YYYY-MM' }
        estado: { type: string, enum: [pendiente, aprobada, pagada] }
        monto: { type: integer, description: 'En pesos' }
        detalle:
          type: array
          items:
            type: object
            required: [tiendaId, tienda, plan, comision]
            properties:
              tiendaId: { type: string }
              tienda: { type: string }
              plan: { $ref: '#/components/schemas/Plan' }
              comision: { type: integer }
        facturaUrl: { type: [string, 'null'] }
        fechaPago: { type: string, format: date, description: 'El 10 del mes siguiente' }
        pagadoEn: { type: [string, 'null'], format: date }
    PanelPartner:
      type: object
      required: [hoy, partner, tiendas, clics, pagos, colaboraciones]
      properties:
        hoy: { type: string, format: date }
        partner:
          type: object
          required: [nombre, email, nivel, nivelEfectivo, porcentaje, codigo, cupon, aprobadoEn, perfil, cobro]
          properties:
            nombre: { type: string }
            email: { type: string }
            nivel: { $ref: '#/components/schemas/NivelPartner' }
            nivelEfectivo: { $ref: '#/components/schemas/NivelPartner' }
            porcentaje: { type: integer }
            codigo: { type: string, description: 'El ref del link (/empezar?ref=…)' }
            cupon: { type: string }
            aprobadoEn: { type: string, format: date }
            perfil: { $ref: '#/components/schemas/PerfilPartner' }
            cobro:
              oneOf:
                - { $ref: '#/components/schemas/CobroPartner' }
                - { type: 'null' }
        tiendas: { type: array, items: { $ref: '#/components/schemas/TiendaReferida' } }
        clics:
          type: array
          items: { type: object, required: [mes, n], properties: { mes: { type: string }, n: { type: integer } } }
        pagos: { type: array, items: { $ref: '#/components/schemas/PagoPartner' } }
        colaboraciones:
          type: array
          items:
            type: object
            required: [tiendaId, nombre, slug, rol]
            properties:
              tiendaId: { type: string }
              nombre: { type: string }
              slug: { type: string }
              rol: { type: string, enum: [admin, ventas, deposito] }
    PedidoArrepentimiento:
      type: object
      required: [email, nombre, documento, plan]
      properties:
        email: { type: string, description: 'El de la cuenta' }
        nombre: { type: string, maxLength: 80 }
        documento: { type: string, description: 'DNI o CUIT, con o sin guiones' }
        plan: { type: string, maxLength: 120, description: 'Plan contratado y fecha' }
        motivo: { type: string, maxLength: 1000 }
    Alta:
      type: object
      required: [nombre, tienda, email, clave]
      properties:
        nombre: { type: string }
        tienda: { type: string }
        email: { type: string }
        clave: { type: string, minLength: 8 }
    Sesion:
      type: object
      required: [token, venceEn, tiendaId]
      properties:
        token: { type: string, description: 'Se entrega una sola vez; el BFF lo guarda en una cookie httpOnly' }
        venceEn: { type: string, format: date-time }
        tiendaId: { type: string }
    DatosSesion:
      type: object
      required: [usuario, tiendaId, rol, venceEn]
      properties:
        usuario:
          type: object
          required: [id, nombre, email]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            email: { type: string }
        tiendaId: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, deposito, ''] }
        venceEn: { type: string, format: date-time }
    Rubro:
      type: object
      required: [id, nombre, plantilla, tienda]
      properties:
        id: { type: string, examples: [gastronomia] }
        nombre: { type: string, examples: [Gastronomía] }
        plantilla: { type: string, description: Plantilla de tienda que se usa por defecto }
        tienda: { type: string, description: Nombre de la tienda de ejemplo }
    Plan:
      type: string
      enum: [gratis, emprende, pro, negocio]
    Tienda:
      type: object
      required: [id, slug, nombre, rubro, plantilla, plan, creadaEn]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$' }
        nombre: { type: string }
        rubro: { type: string }
        plantilla: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        creadaEn: { type: string, format: date-time }
    Franja:
      type: object
      description: 'Un tramo de atención de un día de la semana, en hora de Argentina (UTC−3)'
      required: [dia, desde, hasta]
      properties:
        dia: { type: integer, minimum: 0, maximum: 6, description: '0 = domingo' }
        desde: { type: string, pattern: '^([01]\d|2[0-3]):(00|15|30|45)$', description: 'Múltiplo de 15 min, menor que hasta' }
        hasta: { type: string, pattern: '^(([01]\d|2[0-3]):(00|15|30|45)|24:00)$', description: 'Múltiplo de 15 min; se acepta 24:00' }
    AjustesTurnos:
      type: object
      required: [activo, sena, anticipacionMin, diasVista, horario]
      properties:
        activo: { type: boolean }
        sena: { type: integer, minimum: 0, maximum: 100, description: 'Porcentaje del precio (0 = sin seña); por defecto 30' }
        anticipacionMin: { type: integer, minimum: 0, maximum: 10080, description: 'Minutos mínimos para reservar; por defecto 60' }
        diasVista: { type: integer, minimum: 1, maximum: 90, description: 'Días hacia adelante que se pueden reservar (hoy cuenta como el primero); por defecto 14' }
        horario: { type: array, maxItems: 42, items: { $ref: '#/components/schemas/Franja' } }
    ServicioEditable:
      type: object
      required: [nombre, descripcion, precio, duracion, foto, etiqueta, activo]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 60 }
        descripcion: { type: string, maxLength: 200 }
        precio: { type: integer, minimum: 1, description: 'Pesos enteros' }
        duracion: { type: integer, minimum: 15, maximum: 480, multipleOf: 15, description: 'Minutos' }
        foto: { type: [string, 'null'], maxLength: 2048 }
        etiqueta: { type: [string, 'null'], maxLength: 20 }
        activo: { type: boolean }
        orden: { type: integer, minimum: 0 }
    Servicio:
      allOf:
        - { $ref: '#/components/schemas/ServicioEditable' }
        - type: object
          required: [id, orden]
          properties:
            id: { type: string }
            orden: { type: integer }
    ProfesionalEditable:
      type: object
      required: [nombre, rol, foto, servicios, activo]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 40 }
        rol: { type: string, maxLength: 60 }
        foto: { type: [string, 'null'], maxLength: 2048 }
        servicios: { type: array, maxItems: 100, items: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }, description: 'Ids de los servicios que hace; vacío = todos' }
        activo: { type: boolean }
        orden: { type: integer, minimum: 0 }
    Profesional:
      allOf:
        - { $ref: '#/components/schemas/ProfesionalEditable' }
        - type: object
          required: [id, orden]
          properties:
            id: { type: string }
            orden: { type: integer }
    EstadoTurno:
      type: string
      enum: [reservado, confirmado, cancelado, atendido, ausente]
    Turno:
      type: object
      required: [id, codigo, servicioId, servicio, profesionalId, profesional, inicio, fin, cliente, precio, sena, estado, senaPagada, senaDevuelta, origen, nota, creadoEn, venceEn, vencido]
      properties:
        id: { type: string }
        codigo: { type: string, description: 'Público, aleatorio (≥ 16 caracteres url-safe)' }
        servicioId: { type: string }
        servicio: { type: string, description: 'Nombre copiado al reservar' }
        profesionalId: { type: string }
        profesional: { type: string, description: 'Nombre copiado al reservar' }
        inicio: { type: string, format: date-time, description: 'ISO con offset −03:00' }
        fin: { type: string, format: date-time }
        cliente:
          type: object
          required: [nombre, telefono, email]
          properties:
            nombre: { type: string }
            telefono: { type: string }
            email: { type: string }
        precio: { type: integer, description: 'Pesos' }
        sena: { type: integer, description: 'Monto de la seña en pesos (0 = sin seña)' }
        estado: { $ref: '#/components/schemas/EstadoTurno' }
        senaPagada: { type: boolean }
        senaDevuelta: { type: boolean, description: 'Se devolvió con Mercado Pago (Devolver la seña)' }
        origen: { type: string, enum: [tienda, panel] }
        nota: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
        venceEn: { type: [string, 'null'], format: date-time, description: 'Sólo mientras espera la seña' }
        vencido: { type: boolean, description: 'Reservado, sin seña y pasado venceEn: ya no ocupa el horario' }
    TurnoNuevo:
      type: object
      required: [servicioId, profesionalId, inicio, nombre, telefono, email]
      properties:
        servicioId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        profesionalId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        inicio: { type: string, format: date-time }
        nombre: { type: string, minLength: 2, maxLength: 80 }
        telefono: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 120, description: 'Puede ir vacío desde el panel' }
        nota: { type: [string, 'null'], maxLength: 300 }
        forzar: { type: boolean, default: false, description: 'Reservar aunque se superponga' }
    ReservaTurno:
      type: object
      required: [servicioId, profesionalId, inicio, nombre, telefono, email]
      properties:
        servicioId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        profesionalId: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{1,64}$', description: 'null = cualquiera (el primero libre por orden)' }
        inicio: { type: string, format: date-time }
        nombre: { type: string, minLength: 2, maxLength: 80 }
        telefono: { type: string, maxLength: 20 }
        email: { type: string, format: email, maxLength: 120 }
    HorarioLibre:
      type: object
      required: [inicio, profesionalId]
      properties:
        inicio: { type: string, format: date-time, description: 'ISO con offset −03:00' }
        profesionalId: { type: [string, 'null'], description: 'El profesional pedido (null = cualquiera); al reservar se asigna el primero libre por orden' }
    TurnosPublicos:
      type: object
      description: 'TiendaPublica.turnos (null si la tienda no toma turnos): sólo servicios y profesionales activos'
      required: [servicios, profesionales, sena, anticipacionMin, diasVista, horario]
      properties:
        servicios: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
        profesionales: { type: array, items: { $ref: '#/components/schemas/Profesional' } }
        sena: { type: integer, description: 'Porcentaje que se cobra al reservar (0 si no hay seña o la tienda no tiene Mercado Pago)' }
        anticipacionMin: { type: integer }
        diasVista: { type: integer }
        horario: { type: array, items: { $ref: '#/components/schemas/Franja' } }
    TurnoPublico:
      type: object
      description: 'Lo que ve quien reservó (/t/{slug}/turno/{codigo}): sin los datos de contacto'
      required: [codigo, servicio, profesional, inicio, fin, nombre, precio, sena, senaPagada, estado, venceEn, vencido, cancelable, tienda, direccion, whatsapp]
      properties:
        codigo: { type: string }
        servicio: { type: string }
        profesional: { type: string }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        nombre: { type: string, description: 'Sólo el primer nombre de quien reservó' }
        precio: { type: integer }
        sena: { type: integer }
        senaPagada: { type: boolean }
        estado: { $ref: '#/components/schemas/EstadoTurno' }
        venceEn: { type: [string, 'null'], format: date-time }
        vencido: { type: boolean }
        cancelable: { type: boolean, description: 'Reservado sin vencer o confirmado, y falta más que la anticipación mínima' }
        tienda: { type: string }
        direccion: { type: string }
        whatsapp: { type: string }
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    SesionNueva:
      type: object
      required: [token, venceEn]
      properties:
        token: { type: string }
        venceEn: { type: string, format: date-time }
    RolEquipo:
      type: string
      enum: [soporte, administracion, duenio]
    PermisoEquipo:
      type: string
      enum: [tiendas.ver, tiendas.mirar, tiendas.notas, tiendas.prueba, tiendas.pack, tiendas.plan, tiendas.credito, tiendas.pausar, tiendas.cerrar, consultas.ver, consultas.responder, partners.ver, partners.decidir, facturacion.ver, auditoria.ver]
    MiembroEquipo:
      type: object
      required: [id, nombre, rol]
      properties:
        id: { type: string }
        nombre: { type: string }
        rol: { $ref: '#/components/schemas/RolEquipo' }
    SesionEquipo:
      type: object
      required: [miembro, rol, permisos, venceEn]
      properties:
        miembro:
          type: object
          required: [id, nombre, email]
          properties:
            id: { type: string }
            nombre: { type: string }
            email: { type: string }
        rol: { $ref: '#/components/schemas/RolEquipo' }
        permisos: { type: array, items: { $ref: '#/components/schemas/PermisoEquipo' } }
        venceEn: { type: string, format: date-time }
    EstadoTiendaEquipo:
      type: string
      enum: [prueba, activa, cobro_rechazado, cancelada, pausada, cerrada]
    TiendaBreve:
      type: object
      required: [id, nombre, slug, fecha]
      properties:
        id: { type: string }
        nombre: { type: string }
        slug: { type: string }
        fecha: { type: string, description: 'YYYY-MM-DD (vence la prueba, se dio de baja…)' }
        motivo: { type: [string, 'null'] }
    AlertaEquipo:
      type: object
      required: [tipo, titulo, detalle]
      properties:
        tipo: { type: string, enum: [cobro_rechazado, integracion, arrepentimiento] }
        titulo: { type: string }
        detalle: { type: string }
        tiendaId: { type: [string, 'null'] }
        consulta: { type: [string, 'null'], description: 'tipo/id de la consulta (arrepentimiento por vencer)' }
    InicioEquipo:
      type: object
      required: [kpis, pruebas, bajas, alertas]
      properties:
        kpis:
          type: object
          required: [tiendasActivas, nuevasSemana, pruebasPorVencer, mrr, bajasMes, consultasSinResponder, postulacionesNuevas]
          properties:
            tiendasActivas: { type: integer, description: 'Sin cerrar ni pausar' }
            nuevasSemana: { type: integer }
            pruebasPorVencer: { type: integer, description: 'En prueba que vencen en 3 días o menos' }
            mrr: { type: integer, description: 'Centavos por mes de los abonos activos (el anual, con el 25 % menos)' }
            bajasMes: { type: integer }
            consultasSinResponder: { type: integer }
            postulacionesNuevas: { type: integer }
        pruebas: { type: array, items: { $ref: '#/components/schemas/TiendaBreve' } }
        bajas: { type: array, items: { $ref: '#/components/schemas/TiendaBreve' } }
        alertas: { type: array, items: { $ref: '#/components/schemas/AlertaEquipo' } }
    FilaTiendaEquipo:
      type: object
      required: [id, nombre, slug, titular, email, plan, ciclo, estado, rubro, plantilla, partner, creadaEn, dias, mrr]
      properties:
        id: { type: string }
        nombre: { type: string }
        slug: { type: string }
        titular: { type: string }
        email: { type: string }
        plan: { type: string, enum: [gratis, emprende, pro, negocio] }
        ciclo: { type: string, enum: [mes, anio] }
        estado: { $ref: '#/components/schemas/EstadoTiendaEquipo' }
        rubro: { type: string }
        plantilla: { type: string }
        partner: { type: string, description: 'Ref del link de partner que la trajo ("" si ninguno)' }
        creadaEn: { type: string, format: date-time }
        dias: { type: integer, description: 'Días desde el alta (el rango de la lista)' }
        mrr: { type: integer, description: 'Centavos por mes que aporta' }
    AccionTiendaEquipo:
      type: object
      required: [accion]
      properties:
        accion: { type: string, enum: [extender_prueba, cambiar_plan, aplicar_credito, regalar_pack, pausar, reactivar, cerrar] }
        dias: { type: integer, minimum: 1, maximum: 30, description: extender_prueba }
        plan: { type: string, enum: [gratis, emprende, pro, negocio], description: cambiar_plan }
        monto: { type: integer, minimum: 100, maximum: 150000000, description: 'aplicar_credito, en centavos' }
        cantidad: { type: integer, minimum: 1, maximum: 5, description: regalar_pack }
        motivo: { type: string, maxLength: 500, description: 'Obligatorio para crédito, pausar y cerrar' }
        confirmacion: { type: string, description: 'cerrar: la dirección (slug) de la tienda, escrita a mano' }
    NotaEquipo:
      type: object
      required: [id, texto, autor, creadaEn]
      properties:
        id: { type: string }
        texto: { type: string }
        autor: { type: string }
        creadaEn: { type: string, format: date-time }
    FichaTiendaEquipo:
      type: object
      required: [tienda, negocio, titular, personas, plan, uso, integraciones, dominios, actividad, notas]
      properties:
        tienda:
          type: object
          required: [id, nombre, slug, rubro, plantilla, creadaEn, estado, partner]
          properties:
            id: { type: string }
            nombre: { type: string }
            slug: { type: string }
            rubro: { type: string }
            plantilla: { type: string }
            creadaEn: { type: string, format: date-time }
            estado: { $ref: '#/components/schemas/EstadoTiendaEquipo' }
            partner: { type: string }
            motivoBaja: { type: [string, 'null'] }
        negocio:
          type: object
          description: 'Datos del negocio (Configuración › Negocio): razón social, CUIT, teléfono, dirección…'
          additionalProperties: { type: string }
        titular:
          type: [object, 'null']
          required: [nombre, email, desde]
          properties:
            nombre: { type: string }
            email: { type: string }
            desde: { type: string, format: date-time }
        personas: { type: integer }
        plan:
          type: object
          required: [actual, ciclo, precio, enPrueba, pruebaHasta, proximoCobro, suscripcion, credito]
          properties:
            actual: { type: string, enum: [gratis, emprende, pro, negocio] }
            ciclo: { type: string, enum: [mes, anio] }
            precio: { type: integer, description: 'Centavos por mes' }
            enPrueba: { type: boolean }
            pruebaHasta: { type: string, format: date-time }
            proximoCobro: { type: [string, 'null'], format: date-time }
            suscripcion: { type: [string, 'null'], description: 'Estado de la suscripción en Mercado Pago (authorized, paused, cancelled, pending)' }
            credito: { type: integer, description: 'Saldo a favor en centavos' }
        uso:
          type: object
          required: [productos, pedidosMes, packsMes]
          properties:
            productos: { type: integer }
            pedidosMes: { type: integer }
            packsMes: { type: integer, description: 'Packs de Hornero sumados este mes' }
        integraciones:
          type: array
          items:
            type: object
            required: [id, nombre, salud]
            properties:
              id: { type: string }
              nombre: { type: string }
              salud: { type: string, enum: [ok, reconectar] }
        dominios:
          type: array
          items:
            type: object
            required: [nombre, verificado, principal]
            properties:
              nombre: { type: string }
              verificado: { type: boolean }
              principal: { type: boolean }
        actividad:
          type: array
          items:
            type: object
            required: [id, cuando, quien, accion]
            properties:
              id: { type: string }
              cuando: { type: string, format: date-time }
              quien: { type: string, enum: [persona, hornero, sistema, staff, integracion] }
              accion: { type: string }
        notas: { type: array, items: { $ref: '#/components/schemas/NotaEquipo' } }
    TipoConsulta:
      type: string
      enum: [contacto, arrepentimiento]
    EstadoConsulta:
      type: string
      enum: [nueva, en_curso, resuelta]
    ConsultaEquipo:
      type: object
      required: [id, tipo, estado, nombre, email, asunto, mensaje, creadaEn, asignadoA]
      properties:
        id: { type: string }
        tipo: { $ref: '#/components/schemas/TipoConsulta' }
        estado: { $ref: '#/components/schemas/EstadoConsulta' }
        nombre: { type: string }
        email: { type: string }
        asunto: { type: string }
        mensaje: { type: string }
        creadaEn: { type: string, format: date-time }
        asignadoA: { type: [string, 'null'] }
        codigo: { type: string, description: 'Arrepentimiento: ARR-AAAA-NNNNNN' }
        plazo: { type: string, description: 'Arrepentimiento: YYYY-MM-DD, último día para devolver (10 días hábiles)' }
        plan: { type: string }
        whatsapp: { type: [string, 'null'] }
        web: { type: [string, 'null'] }
        facturacion: { type: [string, 'null'] }
        origen: { type: [string, 'null'] }
    ConsultaDetalle:
      allOf:
        - { $ref: '#/components/schemas/ConsultaEquipo' }
        - type: object
          required: [respuestas]
          properties:
            documento: { type: string, description: 'Arrepentimiento: DNI o CUIT' }
            respuestas: { type: array, items: { $ref: '#/components/schemas/RespuestaEquipo' } }
    RespuestaEquipo:
      type: object
      required: [id, autor, asunto, texto, creadaEn]
      properties:
        id: { type: string }
        autor: { type: string }
        asunto: { type: string }
        texto: { type: string }
        creadaEn: { type: string, format: date-time }
    BandejaEquipo:
      type: object
      required: [consultas, miembros]
      properties:
        consultas: { type: array, items: { $ref: '#/components/schemas/ConsultaEquipo' } }
        miembros: { type: array, items: { $ref: '#/components/schemas/MiembroEquipo' } }
    PostulacionEquipo:
      type: object
      required: [id, nombre, email, agencia, web, especialidades, estado, motivo, creadaEn]
      properties:
        id: { type: string }
        nombre: { type: string }
        email: { type: string }
        agencia: { type: string }
        web: { type: [string, 'null'] }
        especialidades: { type: array, items: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] } }
        estado: { type: string, enum: [nueva, aprobada, rechazada] }
        motivo: { type: [string, 'null'] }
        creadaEn: { type: string, format: date-time }
    PartnerActivoEquipo:
      type: object
      required: [codigo, nombre, nivel, tiendas, activas, comision]
      properties:
        codigo: { type: string, description: 'Ref del link (/empezar?ref=…)' }
        nombre: { type: string }
        nivel: { type: string, enum: [partner, plata, oro] }
        tiendas: { type: integer, description: Tiendas referidas }
        activas: { type: integer, description: Con abono activo }
        comision: { type: integer, description: 'Centavos por mes a pagar (20/25/30 % de los abonos activos)' }
    PartnersEquipo:
      type: object
      required: [postulaciones, activos]
      properties:
        postulaciones: { type: array, items: { $ref: '#/components/schemas/PostulacionEquipo' } }
        activos: { type: array, items: { $ref: '#/components/schemas/PartnerActivoEquipo' } }
    FacturacionEquipo:
      type: object
      required: [kpis, suscripciones, comprobantes]
      properties:
        kpis:
          type: object
          required: [mrr, cobrosMes, activas, conProblemas, creditos]
          properties:
            mrr: { type: integer }
            cobrosMes: { type: integer, description: 'Centavos que se cobran en lo que queda del mes' }
            activas: { type: integer }
            conProblemas: { type: integer, description: 'Cobro rechazado en Mercado Pago' }
            creditos: { type: integer, description: 'Saldo a favor de todas las tiendas, en centavos' }
        suscripciones:
          type: array
          items:
            type: object
            required: [tiendaId, nombre, plan, ciclo, monto, estado, proximoCobro, credito]
            properties:
              tiendaId: { type: string }
              nombre: { type: string }
              plan: { type: string, enum: [emprende, pro, negocio] }
              ciclo: { type: string, enum: [mes, anio] }
              monto: { type: integer, description: 'Centavos por cobro (el anual, por año)' }
              estado: { $ref: '#/components/schemas/EstadoTiendaEquipo' }
              proximoCobro: { type: [string, 'null'], format: date-time }
              credito: { type: integer }
        comprobantes:
          type: array
          description: 'Facturas de Tu Local Web a cada tienda (ARCA). Vacío hasta conectar ARCA.'
          items:
            type: object
            required: [numero, tienda, fecha, monto]
            properties:
              numero: { type: string }
              tienda: { type: string }
              fecha: { type: string }
              monto: { type: integer }
    AuditoriaEquipo:
      type: object
      required: [registros, miembros]
      properties:
        registros:
          type: array
          items:
            type: object
            required: [id, cuando, miembro, accion, texto, tiendaId, tienda]
            properties:
              id: { type: string }
              cuando: { type: string, format: date-time }
              miembro: { $ref: '#/components/schemas/MiembroEquipo' }
              accion: { type: string }
              texto: { type: string }
              tiendaId: { type: [string, 'null'] }
              tienda: { type: [string, 'null'] }
        miembros: { type: array, items: { $ref: '#/components/schemas/MiembroEquipo' } }
