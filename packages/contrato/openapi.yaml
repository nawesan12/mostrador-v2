      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicacionML' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: despublicarDeMercadoLibre
      summary: Pausa la publicación y deja de sincronizarla.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Pausada }
  /v1/webhooks/mercadolibre:
    post:
      operationId: webhookMercadoLibre
      summary: Avisos de Mercado Libre (orders_v2, questions, items). Se encolan y se traen con el token de la tienda.
      security: []
      responses:
        '200': { description: Recibido }
  /v1/panel/arca:
    get:
      operationId: conexionArca
      summary: La conexión con ARCA (facturación electrónica). Nunca devuelve la clave.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArcaConfig' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/pedido:
    post:
      operationId: pedidoCertificadoArca
      summary: >-
        Genera la clave (queda cifrada en Tu Local Web y no sale nunca) y devuelve el pedido de certificado
        (CSR en PEM) para subir a ARCA. Reemplaza la clave anterior: el certificado que había deja de
        servir. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArcaAlta' }
      responses:
        '200':
          description: El pedido de certificado
          content:
            application/json:
              schema:
                type: object
                required: [pedido]
                properties:
                  pedido: { type: string, maxLength: 8192, description: 'PEM: -----BEGIN CERTIFICATE REQUEST-----' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/certificado:
    put:
      operationId: certificadoArca
      summary: El certificado que devolvió ARCA (PEM). Tiene que ser de la clave de esta tienda y de su CUIT. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificado]
              properties:
                certificado: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArcaCertificado' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
