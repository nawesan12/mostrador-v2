          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
components:
  responses:
    Problema:
      description: Error (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    ResumenPanel:
      type: object
      required: [insignias, notificaciones, canales, prueba]
      properties:
        insignias:
          type: object
          description: 'Números del menú (0: sin insignia)'
          required: [pedidos, carritos, whatsapp, paraHacer]
          properties:
            pedidos: { type: integer, description: 'Para preparar' }
            carritos: { type: integer, description: 'Carritos abandonados recuperables' }
            whatsapp: { type: integer, description: 'Conversaciones sin leer' }
            paraHacer: { type: integer, description: 'Tareas de hoy' }
        notificaciones:
          type: array
          items: { $ref: '#/components/schemas/Notificacion' }
        canales:
          type: array
          description: 'Canales conectados (ids: wa, ml, mp, ig, tg)'
          items: { type: string }
        prueba:
          type: object
          required: [plan, diasRestantes, diasTotales]
          properties:
            plan: { type: string }
            diasRestantes: { type: integer }
            diasTotales: { type: integer }
    Comparado:
      type: object
      description: 'El valor del período y el del período anterior del mismo largo'
      required: [actual, anterior]
      properties:
        actual: { type: number }
        anterior: { type: number }
    ContextoHornero:
      type: object
      required: [ventasPorDia, productos, clientes, canales30d]
      properties:
        ventasPorDia:
          type: array
          description: 'Últimos 14 días, del más viejo a hoy (hora de Argentina)'
          items:
            type: object
            required: [fecha, ventas, pedidos]
            properties:
              fecha: { type: string, format: date }
              ventas: { type: integer }
              pedidos: { type: integer }
        productos:
          type: array
          items:
            type: object
            required: [nombre, categoria, precio, stock, vendidos30d, enMl]
            properties:
              nombre: { type: string }
              categoria: { type: [string, 'null'] }
              precio: { type: integer }
              stock: { type: integer }
              vendidos30d: { type: integer }
              enMl: { type: boolean }
        clientes:
          type: object
          required: [total, nuevos30d, conWhatsApp, sinVolver]
          properties:
            total: { type: integer }
            nuevos30d: { type: integer }
            conWhatsApp: { type: integer }
            sinVolver: { type: integer, description: 'Compraron más de una vez y hace 30 días que no vuelven' }
        canales30d:
          type: array
          items:
            type: object
            required: [canal, ventas]
            properties:
              canal: { type: string }
              ventas: { type: integer }
    NombreLista:
      type: string
      enum: [clientes, productos, inventario, facturacion, envios]
    ListaGenerica:
      type: object
      required: [total, filas, segmentos, facetas, resumen]
      properties:
        total: { type: integer }
        filas:
          type: array
          description: 'Registros de la lista (la forma depende de la lista: ver FilaCliente, FilaProducto, …)'
          items: { type: object, additionalProperties: true }
        segmentos:
          type: object
          description: 'Conteo por segmento, sin el filtro de segmento'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Por faceta, conteo de cada valor sin el filtro de esa faceta'
          additionalProperties: { type: object, additionalProperties: { type: integer } }
        resumen:
          type: object
          description: 'Números para el encabezado y la sugerencia de Hornero (dependen de la lista)'
          additionalProperties: { type: number }
    ProductoEditable:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, maxLength: 4000 }
        categoria: { type: [string, 'null'], maxLength: 60 }
        precio: { type: integer, minimum: 0 }
        costo: { type: integer, minimum: 0 }
        sku: { type: string, maxLength: 40 }
        stock: { type: integer, minimum: 0 }
        foto: { type: [string, 'null'] }
        canales:
          type: object
          description: 'Dónde se publica: web, ml, ig, google'
          additionalProperties: { type: boolean }
    Producto:
      allOf:
        - { $ref: '#/components/schemas/ProductoEditable' }
        - type: object
          required: [id, publicado, vendidos30d, slug]
          properties:
            id: { type: string }
            publicado: { type: boolean }
            vendidos30d: { type: integer }
            slug: { type: string }
    MovimientoStock:
      type: object
      required: [tipo, texto, cantidad, en]
      properties:
        tipo: { type: string, enum: [web, local, ml, ajuste, conteo, ingreso, devolucion] }
        texto: { type: string }
        cantidad: { type: integer, description: 'Negativo: sale; positivo: entra' }
        en: { type: string, format: date-time }
    ConversacionBreve:
      type: object
      required: [id, nombre, foto, canal, ultimo, creado, atiende, sinLeer]
      properties:
        id: { type: string }
        nombre: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string, enum: [wa, ig, tg, ml] }
        ultimo: { type: string, description: 'El último mensaje' }
        creado: { type: string, format: date-time }
        atiende: { type: string, enum: [hornero, vos, resuelto] }
        sinLeer: { type: integer }
    Conversacion:
      allOf:
        - { $ref: '#/components/schemas/ConversacionBreve' }
        - type: object
          required: [mensajes, sugerencia, tomada, cliente, clienteId]
          properties:
            clienteId: { type: [string, 'null'], description: 'Su ficha, para crearle un pedido' }
            mensajes:
              type: array
              items:
                type: object
                required: [de, texto, en]
                properties:
                  de: { type: string, enum: [cliente, hornero, vos] }
                  texto: { type: string }
                  en: { type: string, format: date-time }
                  producto:
                    type: [object, 'null']
                    description: 'Tarjeta de producto que mandó Hornero'
                    required: [nombre, foto, precio, stock]
                    properties:
                      nombre: { type: string }
                      foto: { type: [string, 'null'] }
                      precio: { type: integer }
                      stock: { type: integer }
            sugerencia: { type: [string, 'null'], description: 'Respuesta que propone Hornero' }
            tomada: { type: boolean, description: 'La atiende la persona (Hornero en pausa)' }
            cliente:
              type: object
              required: [ciudad, desde, gastado, pedidos, etiquetas, ultimoPedido, sabe]
              properties:
                ciudad: { type: string }
                desde: { type: string, format: date-time }
                gastado: { type: integer }
                pedidos: { type: integer }
                etiquetas: { type: array, items: { type: string } }
                ultimoPedido:
                  type: [object, 'null']
                  required: [numero, resumen, total, estado]
                  properties:
                    numero: { type: integer }
                    resumen: { type: string }
                    total: { type: integer }
                    estado: { $ref: '#/components/schemas/EstadoPedido' }
                sabe: { type: [string, 'null'], description: 'Lo que Hornero aprendió de esta persona' }
    AutomaticosCarritos:
      type: object
      required: [hora, dia, email]
      properties:
        hora: { type: boolean, description: 'WhatsApp a la hora' }
        dia: { type: boolean, description: 'Segundo aviso a las 24 h con 5% off' }
        email: { type: boolean, description: 'Email al tercer día' }
    Carritos:
      type: object
      required: [carritos, abiertos, monto, recuperado, tasa, costoMensaje, automaticos]
      properties:
        carritos:
          type: array
          items:
            type: object
            required: [id, nombre, foto, desde, creado, fotos, cantidad, total, recordado]
            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              desde: { type: string, description: 'Por dónde llegó: la tienda, Instagram…' }
              creado: { type: string, format: date-time }
              fotos: { type: array, items: { type: [string, 'null'] } }
              cantidad: { type: integer }
              total: { type: integer }
              recordado: { type: boolean }
        abiertos: { type: integer }
        monto: { type: integer }
        recuperado: { type: integer, description: 'Recuperado este mes' }
        tasa: { type: number, description: 'Porcentaje recuperado (0–100)' }
        costoMensaje: { type: integer }
        automaticos: { $ref: '#/components/schemas/AutomaticosCarritos' }
    PedidoNuevo:
      type: object
      required: [items, pago, canal]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string }
              cantidad: { type: integer, minimum: 1, maximum: 10000 }
        pago: { type: string, enum: [mp, tarjeta, payway, modo, uala, transf, efectivo] }
        canal: { type: string, enum: [pos, wa, web, ig, ml, tg] }
        envio: { type: string, enum: [retiro, andreani, oca, correo, moto], default: retiro }
        cliente: { type: [string, 'null'], maxLength: 80, description: 'Nombre (en el local suele no haber)' }
        clienteId: { type: [string, 'null'], maxLength: 80, description: 'Un cliente que ya existe (el nombre sale de su ficha)' }
        telefono: { type: [string, 'null'], maxLength: 30 }
        nota: { type: [string, 'null'], maxLength: 300 }
        pagado: { type: boolean, default: true, description: 'false: queda Sin pagar (se cobra con un link)' }
    Devolucion:
      type: object
      required: [id, producto, foto, cliente, pedido, creada, motivo, monto, resolucion, estado]
      properties:
        id: { type: string }
        producto: { type: string }
        foto: { type: [string, 'null'] }
        cliente: { type: string }
        pedido: { type: integer }
        creada: { type: string, format: date-time }
        motivo: { type: string }
        monto: { type: integer }
        resolucion: { type: string, description: 'Lo que pidió: reintegro, reemplazo, cambio' }
        estado: { type: string, enum: [Pendiente, Aprobada, Cambio ofrecido] }
    ResenasYPreguntas:
      type: object
      required: [preguntas, resenas, promedio, total, porEstrellas, recomendaria]
      properties:
        preguntas:
          type: array
          items:
            type: object
            required: [id, producto, foto, pregunta, creada, sugerida, respuesta]
            properties:
              id: { type: string }
              producto: { type: string }
              foto: { type: [string, 'null'] }
              pregunta: { type: string }
              creada: { type: string, format: date-time }
              sugerida: { type: string, description: 'La respuesta que propone Hornero' }
              respuesta: { type: [string, 'null'], description: 'La publicada' }
        resenas:
          type: array
          items:
            type: object
            required: [autor, estrellas, texto, origen, creada]
            properties:
              autor: { type: string }
              estrellas: { type: integer }
              texto: { type: string }
              origen: { type: string, description: 'Tienda, Mercado Libre, Google' }
              creada: { type: string, format: date-time }
        promedio: { type: [number, 'null'] }
        total: { type: integer }
        porEstrellas: { type: array, items: { type: integer }, description: 'De 5 a 1 estrella' }
        recomendaria: { type: integer, description: 'Porcentaje (4 y 5 estrellas)' }
    LinkPublico:
      type: object
      required: [codigo, tienda, concepto, monto, cuotas, pagado, pedido]
      properties:
        codigo: { type: string }
        tienda: { type: string }
        concepto: { type: string }
        monto: { type: integer }
        cuotas: { type: boolean }
        pagado: { type: boolean }
        pedido: { type: [integer, 'null'] }
    ListasPrecio:
      type: object
      required: [listas, productos, muestra, programado]
      properties:
        listas:
          type: array
          items:
            type: object
            required: [id, nombre, quien, ajuste, detalle]
            properties:
              id: { type: string, enum: [minorista, mayorista, ml, revendedoras] }
              nombre: { type: string }
              quien: { type: string }
              ajuste: { type: integer, description: 'Porcentaje sobre el precio base (0 = base)' }
              detalle: { type: string }
        productos: { type: integer, description: 'Cuántos productos toca un aumento' }
        muestra:
          type: array
          items:
            type: object
            required: [id, nombre, precio]
            properties:
              id: { type: string }
              nombre: { type: string }
              precio: { type: integer }
        programado:
          type: [object, 'null']
          required: [pct, redondeo, para]
          properties:
            pct: { type: integer }
            redondeo: { type: string, enum: ['no', '90', '500'] }
            para: { type: string, format: date-time }
    Cupon:
      type: object
      required: [id, codigo, tipo, valor, descripcion, estado, usos, limite, vendio, desconto, canales, empieza, termina, minimo, consejo, creado]
      properties:
        id: { type: string }
        codigo: { type: string }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, description: 'Porcentaje o pesos (0 en envío y regalo)' }
        descripcion: { type: string }
        estado: { type: string, enum: [activo, programado, pausado, terminado] }
        usos: { type: integer }
        limite: { type: integer, description: '0 = sin límite' }
        vendio: { type: integer }
        desconto: { type: integer }
        canales: { type: array, items: { type: string, enum: [web, wa, ig, pos] } }
        empieza: { type: [string, 'null'], format: date-time }
        termina: { type: [string, 'null'], format: date-time }
        minimo: { type: integer }
        consejo: { type: [string, 'null'], description: 'Lo que sugiere Hornero' }
        creado: { type: string, format: date-time }
    CuponNuevo:
      type: object
      required: [codigo, tipo, valor, alcance, quien, minimo, limite, porCliente, vigencia, canales, opciones]
      properties:
        codigo: { type: string, pattern: '^[A-Z0-9-]{3,20}$' }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, minimum: 0, maximum: 100000 }
        alcance: { type: string, enum: [todo, categoria, productos] }
        productos: { type: array, maxItems: 50, items: { type: string } }
        quien: { type: string, enum: [todos, nuevos, vip, riesgo] }
        minimo: { type: integer, minimum: 0 }
        limite: { type: integer, minimum: 0 }
        porCliente: { type: string, enum: ['1', '3', libre] }
        vigencia: { type: string, enum: ['7', finde, '30', hotsale, sin] }
        canales: { type: array, minItems: 1, items: { type: string, enum: [web, wa, ig, pos] } }
        opciones:
          type: object
          required: [hornero, combinable, unicos, link]
          properties:
            hornero: { type: boolean }
            combinable: { type: boolean }
            unicos: { type: boolean }
            link: { type: boolean }
        programar: { type: boolean, default: false }
    Automatica:
      type: object
      required: [id, titulo, detalle, ejemplo, estado, aporte, activa]
      properties:
        id: { type: string, enum: [transf, envio, cantidad, '3x2', cuotas, mayorista, carrito, cumple] }
        titulo: { type: string }
        detalle: { type: string }
        ejemplo: { type: string }
        estado: { type: string }
        aporte: { type: [integer, 'null'], description: 'Lo que vendió con esta promo este mes' }
        activa: { type: boolean }
    Cupones:
      type: object
      required: [cupones, kpis, consejo, segmentos, automaticas, relampago, tienda, productos, categoria]
      properties:
        cupones: { type: array, items: { $ref: '#/components/schemas/Cupon' } }
