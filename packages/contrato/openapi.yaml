          required: [ventas, liquidaciones, gastos, meta, metaPct, falta, sincronizado]
          properties:
            ventas: { type: integer }
            liquidaciones: { type: integer }
            gastos: { type: integer }
            meta: { type: string }
            metaPct: { type: integer }
            falta: { type: integer }
            sincronizado: { type: string, format: date-time }
        kpis:
          type: object
          required: [aLiquidar, aLiquidarDetalle, gastos, gastosDetalle, ganancia, margen, mes]
          properties:
            aLiquidar: { type: integer }
            aLiquidarDetalle: { type: string }
            gastos: { type: integer }
            gastosDetalle: { type: string }
            ganancia: { type: integer }
            margen: { type: [integer, 'null'] }
            mes: { type: string }
        flujo:
          type: array
          description: Próximos 14 días
          items:
            type: object
            required: [dia, entra, sale]
            properties:
              dia: { type: integer }
              entra: { type: integer }
              sale: { type: integer }
        movimientos:
          type: array
          items:
            type: object
            required: [id, tipo, titulo, detalle, monto]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [mp, payway, modo, uala, andreani, oca, correo, moto, transf, gasto, retiro] }
              titulo: { type: string }
              detalle: { type: string }
              monto: { type: integer, description: 'Positivo entra, negativo sale' }
        conciliado: { type: boolean }
    DisenoTienda:
      type: object
      required: [secciones, paleta]
      properties:
        secciones:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [id, visible]
            properties:
              id: { type: string, enum: [hero, cats, prods, revs, ig, wa] }
              visible: { type: boolean }
        paleta: { type: integer, minimum: 0, maximum: 3 }
    MiTienda:
      type: object
      required: [plantilla, direccion, diseno, sinPublicar, vista]
      properties:
        plantilla: { type: string }
        direccion: { type: string, description: 'Dónde se ve la tienda (dominio o dirección de Mostrador)' }
        diseno: { $ref: '#/components/schemas/DisenoTienda' }
        sinPublicar: { type: boolean }
        vista:
          type: object
          required: [tienda, categorias, productos, resena, fotos, portada]
          properties:
            tienda: { type: string }
            categorias: { type: array, items: { type: string } }
            productos:
              type: array
              items:
                type: object
                required: [nombre, foto, precio]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  precio: { type: integer }
            resena:
              type: [object, 'null']
              required: [promedio, texto]
              properties:
                promedio: { type: number }
                texto: { type: string }
            fotos: { type: array, items: { type: string } }
            portada:
              type: object
              required: [foto, titulo]
              properties:
                foto: { type: [string, 'null'] }
                titulo: { type: string }
    Negocio:
      type: object
      required: [nombre, razonSocial, cuit, condicion, direccion, whatsapp, email, horario]
      properties:
        nombre: { type: string, maxLength: 80 }
        razonSocial: { type: string, maxLength: 120 }
        cuit: { type: string, maxLength: 13 }
        condicion: { type: string, maxLength: 60 }
        direccion: { type: string, maxLength: 160 }
        whatsapp: { type: string, maxLength: 30 }
        email: { type: string, maxLength: 120 }
        horario: { type: string, maxLength: 80 }
    Miembro:
      type: object
      required: [id, nombre, contacto, rol, foto, ultimo, pendiente, vos, dobleFactor]
      properties:
        id: { type: string }
        nombre: { type: string }
        contacto: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, deposito] }
        foto: { type: [string, 'null'] }
        ultimo: { type: [string, 'null'], format: date-time }
        pendiente: { type: boolean, description: 'Invitación sin aceptar' }
        vos: { type: boolean }
        dobleFactor: { type: boolean }
    Configuracion:
      type: object
      required: [negocio, equipo, seguridad, sesiones, avisos, plan]
      properties:
        negocio: { $ref: '#/components/schemas/Negocio' }
        equipo: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
        seguridad:
          type: object
          required: [dobleFactor, otroPais, alertas, inactivas]
          properties:
            dobleFactor: { type: boolean }
            otroPais: { type: boolean }
            alertas: { type: boolean }
            inactivas: { type: boolean }
        sesiones:
          type: array
          items:
            type: object
            required: [id, tipo, nombre, donde, cuando, actual]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [compu, celu, caja] }
              nombre: { type: string }
              donde: { type: string }
              cuando: { type: string, format: date-time }
              actual: { type: boolean }
        avisos:
          type: object
          required: [venta, chats, stock, diario, ideas, novedades]
          properties:
            venta: { type: boolean }
            chats: { type: boolean }
            stock: { type: boolean }
            diario: { type: boolean }
            ideas: { type: boolean }
            novedades: { type: boolean }
        plan:
          type: object
          required: [actual, ciclo, enPrueba, diasPrueba]
          properties:
            actual: { type: string, enum: [gratis, emprende, pro, negocio] }
            ciclo: { type: string, enum: [mes, anio] }
            enPrueba: { type: boolean }
            diasPrueba: { type: integer }
    PlanCuenta:
      type: object
      required: [actual, ciclo, enPrueba, diasPrueba, proximoCobro, uso, medio, facturacion, facturas, cancelado]
      properties:
        actual: { type: string, enum: [gratis, emprende, pro, negocio] }
        ciclo: { type: string, enum: [mes, anio] }
        enPrueba: { type: boolean }
        diasPrueba: { type: integer }
        proximoCobro: { type: string, format: date-time }
        uso:
          type: object
          required: [productos, personas, hornero, packs, sinIa]
          properties:
            productos: { type: integer }
            personas: { type: integer }
            hornero: { type: integer, description: 'Respuestas con IA este mes' }
            packs: { type: integer }
            sinIa: { type: integer }
        medio:
          type: [object, 'null']
          required: [marca, ultimos, vence]
          properties:
            marca: { type: string }
            ultimos: { type: string }
            vence: { type: string }
        facturacion:
          type: object
          required: [razonSocial, cuit, tipo]
          properties:
            razonSocial: { type: string }
            cuit: { type: string }
            tipo: { type: string }
        facturas:
          type: array
          items:
            type: object
            required: [numero, detalle, total]
            properties:
              numero: { type: string }
              detalle: { type: string }
              total: { type: integer }
        cancelado:
          type: [object, 'null']
          required: [hasta]
          properties:
            hasta: { type: string, format: date-time }
    Permisos:
      type: object
      required: [permisos]
      properties:
        permisos:
          type: array
          items:
            type: object
            required: [id, titulo, detalle, roles]
            properties:
              id: { type: string }
              titulo: { type: string }
              detalle: { type: string }
              roles:
                type: object
                required: [duenio, admin, ventas, deposito]
                properties:
                  duenio: { type: boolean }
                  admin: { type: boolean }
                  ventas: { type: boolean }
                  deposito: { type: boolean }
    Dominios:
      type: object
      required: [gratis, dominios, registros]
      properties:
        gratis: { type: string, description: 'La dirección que viene con la tienda' }
        dominios:
          type: array
          items:
            type: object
            required: [nombre, detalle, estado, principal]
            properties:
              nombre: { type: string }
              detalle: { type: string }
              estado: { type: string, enum: [activo, verificando] }
              principal: { type: boolean }
              chequeos:
                type: array
                items:
                  type: object
                  required: [titulo, estado]
                  properties:
                    titulo: { type: string }
                    estado: { type: string, enum: [ok, esperando, pendiente] }
        registros:
          type: array
          items:
            type: object
            required: [tipo, nombre, valor]
            properties:
              tipo: { type: string }
              nombre: { type: string }
              valor: { type: string }
    PreferenciasAvisos:
      type: object
      required: [matriz, silencio, resumen]
      properties:
        matriz:
          type: object
          description: '"aviso:canal" → activo (los que no están, van por defecto)'
          additionalProperties: { type: boolean }
        silencio: { type: boolean }
        resumen: { type: string, enum: [whatsapp, email, off] }
    MisDatos:
      type: object
      required: [conteos, recientes, inactivos, borrado]
      properties:
        conteos:
          type: object
          required: [productos, clientes, pedidos, facturas, resenas, conversaciones]
          properties:
            productos: { type: integer }
            clientes: { type: integer }
            pedidos: { type: integer }
            facturas: { type: integer }
            resenas: { type: integer }
            conversaciones: { type: integer }
        recientes:
          type: array
          items:
            type: object
            required: [tipo, formato, en]
            properties:
              tipo: { type: string }
              formato: { type: string }
              en: { type: string, format: date-time }
        inactivos: { type: integer }
        borrado:
          type: [object, 'null']
          required: [clientes, el]
          properties:
            clientes: { type: integer }
            el: { type: string, format: date-time }
    Tablero:
      type: object
      required: [periodo, desde, hasta, hola, ventas, serie, kpis, canales, meta, avisos, ultimosPedidos, paraHacer, enVivo, caja, liquidaciones, hornero, bandeja, integraciones, masVendidos, resenas, envios]
      properties:
        periodo: { type: string, enum: [hoy, 7d, 30d] }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        hola: { type: [string, 'null'], description: 'Nombre de pila de quien entra' }
        ventas: { $ref: '#/components/schemas/Comparado' }
        serie:
          type: object
          description: 'Ventas acumuladas en 14 tramos del período, y las del período anterior'
          required: [actual, anterior]
          properties:
            actual: { type: array, items: { type: number } }
            anterior: { type: array, items: { type: number } }
        kpis:
          type: object
          required: [pedidos, ticket, conversion, clientesNuevos]
          properties:
            pedidos: { $ref: '#/components/schemas/Comparado' }
            ticket: { $ref: '#/components/schemas/Comparado' }
            conversion: { $ref: '#/components/schemas/Comparado', description: 'Porcentaje (3.4 = 3,4 %)' }
            clientesNuevos: { $ref: '#/components/schemas/Comparado' }
        canales:
          type: array
          description: 'Parte de las ventas del período por canal (web, wa, ml, ig, pos, tg), de mayor a menor'
          items:
            type: object
            required: [canal, parte]
            properties:
              canal: { type: string }
              parte: { type: number, description: 'De 0 a 1' }
        meta:
          type: object
          required: [objetivo, actual, proyeccion]
          properties:
            objetivo: { type: integer, description: '0: sin meta' }
            actual: { type: integer, description: 'Vendido en el mes' }
            proyeccion: { type: integer, description: 'Al ritmo actual, cómo cierra el mes' }
        avisos:
          type: object
          required: [certificadoDias]
          properties:
            certificadoDias: { type: [integer, 'null'], description: 'Días para que venza el certificado de ARCA, si hay que avisar' }
        ultimosPedidos:
          type: array
          items: { $ref: '#/components/schemas/PedidoBreve' }
        paraHacer:
          type: object
          required: [preparar, chats, chatMasViejoMin, transferencias, transferenciasMonto, sinStock, sinStockEnMl]
          properties:
            preparar: { type: integer }
            chats: { type: integer }
            chatMasViejoMin: { type: integer }
            transferencias: { type: integer }
            transferenciasMonto: { type: integer }
            sinStock: { type: integer }
            sinStockEnMl: { type: integer }
        enVivo:
          type: object
          required: [personas, paginas, carritos, carritosMonto]
          properties:
            personas: { type: integer }
            paginas:
              type: array
              items:
                type: object
                required: [nombre, personas]
                properties:
                  nombre: { type: string }
                  personas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
        caja:
          type: object
          required: [abierta, total, medios]
          properties:
            abierta: { type: [string, 'null'], format: date-time, description: 'Cuándo se abrió hoy (null: cerrada)' }
            total: { type: integer }
            medios:
              type: array
              items:
                type: object
                required: [medio, monto]
                properties:
                  medio: { type: string, description: 'efectivo, tarjeta, mp, modo, transf' }
                  monto: { type: integer }
        liquidaciones:
          type: array
          description: 'Lo que se acredita en los próximos 7 días, por medio de pago'
          items:
            type: object
            required: [medio, fecha, monto]
            properties:
              medio: { type: string }
              fecha: { type: string, format: date }
              monto: { type: integer }
        hornero:
          type: object
          required: [chatsHoy, ideas, carritos, carritosMonto, costoMensaje, recordados, audiencia, ideasHechas]
          properties:
            chatsHoy: { type: integer }
            ideas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
            costoMensaje: { type: integer, description: 'Lo que cuesta cada mensaje de WhatsApp' }
            recordados: { type: boolean, description: 'Ya se les mandó el recordatorio' }
            audiencia: { type: integer, description: 'Clientes que aceptan mensajes por WhatsApp' }
            ideasHechas:
              type: array
              description: 'Ideas de Hornero ya aprobadas (carritos, stock, promo)'
              items: { type: string }
        bandeja:
          type: array
          items:
            type: object
            required: [nombre, foto, mensaje, creado, atiende, sinLeer]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'], description: 'Id de la foto en Unsplash' }
              mensaje: { type: string }
              creado: { type: string, format: date-time }
              atiende: { type: string, enum: [hornero, vos] }
              sinLeer: { type: integer }
        integraciones:
          type: array
          description: 'Integraciones conectadas con su dato del momento'
          items:
            type: object
            required: [id, valor]
            properties:
              id: { type: string, description: 'mp (cobrado en 7 días), ml (publicaciones), wa (chats esperando), arca (días del certificado), andreani (envíos en camino)' }
              valor: { type: integer }
        masVendidos:
          type: array
          description: 'Los 4 más vendidos de los últimos 7 días'
          items:
            type: object
            required: [productoId, nombre, foto, unidades]
            properties:
              productoId: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              unidades: { type: integer }
        resenas:
          type: object
          required: [promedio, nuevas]
          properties:
            promedio: { type: [number, 'null'] }
            nuevas:
              type: array
              items:
                type: object
                required: [texto, autor, producto, canal, estrellas]
                properties:
                  texto: { type: string }
                  autor: { type: string }
                  producto: { type: string }
                  canal: { type: string }
                  estrellas: { type: integer }
        envios:
          type: object
          required: [paquetes, retiros]
          properties:
            paquetes: { type: integer }
            retiros:
              type: array
              items:
                type: object
                required: [hora, transporte, paquetes, ciudad, proximo]
                properties:
                  hora: { type: string, description: 'HH:MM' }
                  transporte: { type: string, enum: [andreani, oca, correo, moto] }
                  paquetes: { type: integer }
                  ciudad: { type: [string, 'null'], description: 'Si todos van a la misma ciudad' }
                  proximo: { type: boolean }
    EstadoPedido:
      type: string
      enum: [Sin pagar, Para preparar, Listo para despachar, En camino, Entregado, Cancelado]
    PedidoFila:
      type: object
      required: [numero, cliente, foto, ciudad, canal, pago, envio, estado, total, creado, productos, cantidadProductos, vip, hornero, mayorista]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        ciudad: { type: string }
        canal: { type: string }
        pago: { type: string, description: 'mp, tarjeta, payway, modo, uala, transf, efectivo' }
        envio: { type: string, description: 'andreani, oca, correo, moto, retiro' }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
        productos:
          type: array
          description: 'Los primeros 3'
          items:
            type: object
            required: [nombre, foto]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        cantidadProductos: { type: integer }
        vip: { type: boolean }
        hornero: { type: boolean, description: 'Lo vendió Hornero' }
        mayorista: { type: boolean }
    ListaPedidos:
      type: object
      required: [total, suma, filas, etapas, facetas]
      properties:
        total: { type: integer, description: 'Pedidos que cumplen los filtros' }
        suma: { type: integer }
        filas: { type: array, items: { $ref: '#/components/schemas/PedidoFila' } }
        etapas:
          type: object
          description: 'Por estado, con todos los filtros salvo el de estado'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Conteos de canal, pago y envío; cada uno sin su propio filtro'
          required: [canal, pago, envio]
          properties:
            canal: { type: object, additionalProperties: { type: integer } }
            pago: { type: object, additionalProperties: { type: integer } }
            envio: { type: object, additionalProperties: { type: integer } }
    PedidoDetalle:
      allOf:
        - { $ref: '#/components/schemas/PedidoFila' }
        - type: object
          required: [items, subtotal, costoEnvio, comprador, estadoPago, factura, seguimiento, llega, nota, historial]
          properties:
            items:
              type: array
              items:
                type: object
                required: [nombre, foto, cantidad, precio]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  cantidad: { type: integer }
                  precio: { type: integer }
            subtotal: { type: integer }
            costoEnvio: { type: integer }
            comprador:
              type: object
              required: [nombre, foto, telefono, email, desde, pedidos, gastado]
              properties:
                nombre: { type: string }
                foto: { type: [string, 'null'] }
                telefono: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
                desde: { type: string, format: date-time }
                pedidos: { type: integer }
                gastado: { type: integer }
            estadoPago: { type: string, description: 'Aprobado, Acreditada, Pendiente, Cobrado' }
            factura: { type: [string, 'null'], description: 'B 0004-00000812' }
            seguimiento: { type: [string, 'null'] }
            llega: { type: [string, 'null'], format: date }
            nota: { type: [string, 'null'], description: 'Lo que anotó Hornero de la charla' }
            historial:
              type: array
              items:
                type: object
                required: [texto, cuando, hecho]
                properties:
                  texto: { type: string }
                  cuando: { type: [string, 'null'], format: date-time }
                  hecho: { type: boolean }
    PedidoBreve:
      type: object
      required: [numero, cliente, foto, canal, estado, total, creado]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
    Notificacion:
      type: object
      required: [id, tipo, titulo, detalle, creada, leida, grupo]
      properties:
        id: { type: string }
        tipo: { type: string, description: 'Marca o tipo del ícono: wa, mp, ml, warn, arca, star, ok, err' }
        titulo: { type: string }
        detalle: { type: string }
        creada: { type: string, format: date-time }
        leida: { type: boolean }
        grupo: { type: string, enum: [ventas, sistema] }
    Onboarding:
      type: object
      required: [elecciones]
      properties:
        plantilla: { type: string, description: 'Una de las 16 del handoff' }
        elecciones: { type: object, additionalProperties: true, description: 'Objetivos, canales, secciones, cobros y envíos, tono, equipo (hasta 16 KB)' }
        terminado: { type: boolean }
    Consulta:
      type: object
      required: [nombre, email]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        whatsapp: { type: string, description: 'Con característica; se guardan sólo los dígitos' }
        web: { type: string, maxLength: 200 }
        facturacion: { type: string, enum: [empiezo, hasta-5, 5-a-20, 20-a-100, mas-de-100] }
        origen: { type: string, enum: [tiendanube, empretienda, mercadoshops, shopify, woocommerce, ninguna] }
        mensaje: { type: string, maxLength: 2000 }
    Postulacion:
      type: object
      required: [nombre, email, agencia]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        agencia: { type: string, maxLength: 120 }
        web: { type: string, maxLength: 200 }
        especialidades:
          type: array
          items: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    PedidoArrepentimiento:
      type: object
      required: [email, nombre, documento, plan]
      properties:
        email: { type: string, description: 'El de la cuenta' }
        nombre: { type: string, maxLength: 80 }
        documento: { type: string, description: 'DNI o CUIT, con o sin guiones' }
        plan: { type: string, maxLength: 120, description: 'Plan contratado y fecha' }
        motivo: { type: string, maxLength: 1000 }
    Alta:
      type: object
      required: [nombre, tienda, email, clave]
      properties:
        nombre: { type: string }
        tienda: { type: string }
        email: { type: string }
        clave: { type: string, minLength: 8 }
    Sesion:
      type: object
      required: [token, venceEn, tiendaId]
      properties:
        token: { type: string, description: 'Se entrega una sola vez; el BFF lo guarda en una cookie httpOnly' }
        venceEn: { type: string, format: date-time }
        tiendaId: { type: string }
    DatosSesion:
      type: object
      required: [usuario, tiendaId, rol, venceEn]
      properties:
        usuario:
          type: object
          required: [id, nombre, email]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            email: { type: string }
        tiendaId: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, deposito, ''] }
        venceEn: { type: string, format: date-time }
    Rubro:
      type: object
      required: [id, nombre, plantilla, tienda]
      properties:
        id: { type: string, examples: [gastronomia] }
        nombre: { type: string, examples: [Gastronomía] }
        plantilla: { type: string, description: Plantilla de tienda que se usa por defecto }
        tienda: { type: string, description: Nombre de la tienda de ejemplo }
    Plan:
      type: string
      enum: [gratis, emprende, pro, negocio]
    Tienda:
      type: object
      required: [id, slug, nombre, rubro, plantilla, plan, creadaEn]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$' }
        nombre: { type: string }
        rubro: { type: string }
        plantilla: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        creadaEn: { type: string, format: date-time }
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
