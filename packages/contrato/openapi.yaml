openapi: 3.1.0
info:
  title: Tu Local Web
  version: 0.1.0
  description: |
    Contrato único entre el front (SvelteKit, BFF) y sus dos fuentes de datos: el sandbox de la
    demo (D1) y la API Go. Los casos de `casos/` corren contra las dos implementaciones.
    Montos en centavos (enteros). Fechas de negocio YYYY-MM-DD en hora de Argentina.
    Errores: application/problem+json.
paths:
  /v1/rubros:
    get:
      operationId: listarRubros
      summary: Rubros con su plantilla y tienda de ejemplo
      responses:
        '200':
          description: Rubros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rubro' }
  /v1/auth/registro:
    post:
      operationId: registrar
      summary: Crea la cuenta, su tienda y la sesión (sigue en el onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Alta' }
      responses:
        '201': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/ingresar:
    post:
      operationId: ingresar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string }
                clave: { type: string }
                recordarme: { type: boolean }
      responses:
        '200': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/salir:
    post:
      operationId: salir
      responses:
        '204': { description: Sesión cerrada }
  /v1/auth/sesion:
    get:
      operationId: sesion
      responses:
        '200': { description: Sesión en curso, content: { application/json: { schema: { $ref: '#/components/schemas/DatosSesion' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/auth/recuperar:
    post:
      operationId: recuperar
      summary: Manda el link para crear una contraseña nueva. Responde igual exista o no la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Recibido }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/restablecer/verificar:
    post:
      operationId: verificarRestablecer
      summary: Si el link de contraseña nueva sigue sirviendo (no lo usa). Va por POST para que el token no quede en logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Sirve }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/auth/restablecer:
    post:
      operationId: restablecer
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, clave], properties: { token: { type: string }, clave: { type: string } } }
      responses:
        '204': { description: Contraseña cambiada; se cierran todas las sesiones }
        '400': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/arrepentimientos:
    post:
      operationId: pedirArrepentimiento
      summary: Botón de arrepentimiento (Res. 424/2020). Público, sin sesión; devuelve el código de trámite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoArrepentimiento' }
      responses:
        '201':
          description: Registrado; la confirmación sale por mail
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string, pattern: '^ARR-\d{4}-\d{6,}$' } } }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/contacto:
    post:
      operationId: consultar
      summary: Consulta de ventas (/contacto). Público, sin sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Consulta' }
      responses:
        '202': { description: Registrada; confirmación por mail }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/partners/postulaciones:
    post:
      operationId: postularPartner
      summary: Postulación al programa de partners. Repetir el email no es error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Postulacion' }
      responses:
        '202': { description: Registrada }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo:
    get:
      operationId: panelPartner
      summary: El panel de partners de la persona de la sesión (/partners/panel). 404 si no es partner.
      responses:
        '200':
          description: Panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelPartner' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/perfil:
    put:
      operationId: guardarPerfilPartner
      summary: El perfil público que se ve en "Buscar un partner".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilPartner' }
      responses:
        '200':
          description: Guardado (limpio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/cobro:
    put:
      operationId: guardarCobroPartner
      summary: Datos de cobro (CBU/CVU o alias, titular, CUIT con verificador, condición frente al IVA).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobroPartner' }
      responses:
        '200':
          description: Guardado (limpio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CobroPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/pagos/{mes}/factura:
    put:
      operationId: subirFacturaPartner
      summary: El link (https) de la factura del partner para un pago que todavía no se pagó.
      parameters:
        - { name: mes, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, maxLength: 500 } } }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/partners/clics:
    post:
      operationId: sumarClicPartner
      summary: Un clic en el link de un partner (/empezar?ref=…). Sólo con la clave del BFF; un ref desconocido no hace nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ref], properties: { ref: { type: string, maxLength: 40 } } }
      responses:
        '204': { description: Contado (o ignorado) }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners:
    post:
      operationId: aprobarPartner
      summary: 'Uso interno (backoffice, clave del BFF): convierte la cuenta del email en partner o le cambia el nivel.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                nivel: { $ref: '#/components/schemas/NivelPartner' }
                nombre: { type: string, description: 'De la agencia; arma el link y el cupón' }
      responses:
        '200':
          description: Aprobado
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners/liquidaciones:
    post:
      operationId: liquidarPartner
      summary: 'Uso interno: arma (o rehace, si sigue pendiente) la liquidación de un mes.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, mes], properties: { email: { type: string }, mes: { type: string } } }
      responses:
        '200':
          description: Liquidación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagoPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners/pagos:
    put:
      operationId: estadoPagoPartner
      summary: 'Uso interno: pasa un pago a aprobada o pagada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, mes, estado]
              properties:
                email: { type: string }
                mes: { type: string }
                estado: { type: string, enum: [aprobada, pagada] }
      responses:
        '204': { description: Cambiado }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/novedades/suscripciones:
    post:
      operationId: suscribirNovedades
      summary: Suma un email al resumen mensual de novedades.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Suscripto (o ya lo estaba) }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/novedades/baja:
    post:
      operationId: bajaNovedades
      summary: Baja con el token del link del mail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Dado de baja }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/panel/onboarding:
    put:
      operationId: guardarOnboarding
      summary: Guarda lo elegido en el onboarding (y si terminó). La plantilla pasa a ser la de la tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Onboarding' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/resumen:
    get:
      operationId: resumenPanel
      summary: Lo que muestra el armazón del panel en cada pantalla (insignias del menú y notificaciones).
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenPanel' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/tablero:
    get:
      operationId: tablero
      summary: El Resumen del panel (dashboard) para un período.
      parameters:
        - name: periodo
          in: query
          schema: { type: string, enum: [hoy, 7d, 30d], default: 7d }
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/meta:
    put:
      operationId: guardarMeta
      summary: La meta de ventas del mes (en pesos; 0 la saca).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objetivo]
              properties:
                objetivo: { type: integer, minimum: 0, maximum: 100000000000 }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/avisos/{aviso}/ocultar:
    post:
      operationId: ocultarAviso
      summary: Descarta un aviso del Resumen (por ahora, el del certificado de ARCA).
      parameters:
        - { name: aviso, in: path, required: true, schema: { type: string, enum: [certificado] } }
      responses:
        '204': { description: Oculto }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/carritos/recordar:
    post:
      operationId: recordarCarritos
      summary: Manda por WhatsApp el recordatorio a los carritos abandonados recuperables.
      responses:
        '200':
          description: Cuántos mensajes quedaron en cola
          content:
            application/json:
              schema:
                type: object
                required: [enviados]
                properties:
                  enviados: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/contexto:
    get:
      operationId: contextoHornero
      summary: Lo que Hornero sabe de la tienda para responder (ventas por día, productos, clientes, pendientes).
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextoHornero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/ideas/{idea}:
    post:
      operationId: marcarIdea
      summary: Aprueba (o deshace) una idea de Hornero.
      parameters:
        - { name: idea, in: path, required: true, schema: { type: string, enum: [carritos, stock, promo] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hecha]
              properties:
                hecha: { type: boolean }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos:
    get:
      operationId: listarPedidos
      summary: Pedidos con filtros (en la URL del panel), conteos por etapa y facetas, y una ventana de filas.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Cliente, número, producto o ciudad' }
        - { name: estado, in: query, schema: { type: string }, description: 'Separados por coma' }
        - { name: canal, in: query, schema: { type: string } }
        - { name: pago, in: query, schema: { type: string } }
        - { name: envio, in: query, schema: { type: string } }
        - { name: fecha, in: query, schema: { type: string, enum: [hoy, 7d, 30d, todo], default: todo } }
        - { name: minimo, in: query, schema: { type: integer, minimum: 0 } }
        - { name: vip, in: query, schema: { type: boolean } }
        - { name: hornero, in: query, schema: { type: boolean } }
        - { name: mayorista, in: query, schema: { type: boolean } }
        - { name: orden, in: query, schema: { type: string, enum: [nuevos, urgentes, monto, viejos], default: nuevos } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaPedidos' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      operationId: crearPedido
      summary: Un pedido nuevo (venta en el local o cargado a mano). Descuenta el stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoNuevo' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                required: [numero, total]
                properties:
                  numero: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/lote:
    post:
      operationId: pedidosEnLote
      summary: Acción sobre varios pedidos (preparar, etiquetas, facturar, avisar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeros, accion]
              properties:
                numeros: { type: array, maxItems: 500, items: { type: integer } }
                accion: { type: string, enum: [preparar, etiquetas, facturar, avisar] }
      responses:
        '200':
          description: Cuántos se pudieron hacer (los que no estaban en la etapa justa se saltean)
          content:
            application/json:
              schema:
                type: object
                required: [hechos, cambios]
                properties:
                  hechos: { type: integer }
                  cambios:
                    type: array
                    description: 'Para deshacer: número y estado anterior'
                    items:
                      type: object
                      required: [numero, antes]
                      properties:
                        numero: { type: integer }
                        antes: { $ref: '#/components/schemas/EstadoPedido' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}:
    get:
      operationId: obtenerPedido
      summary: El detalle de un pedido.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/estado:
    post:
      operationId: cambiarEstadoPedido
      summary: Avanza el pedido una etapa, lo vuelve una atrás (deshacer) o lo cancela.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPedido' }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/recordatorio:
    post:
      operationId: recordarPago
      summary: Le manda al cliente un recordatorio de pago por WhatsApp.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Enviado }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas/{lista}:
    get:
      operationId: listar
      summary: 'Motor de listas (Clientes, Productos, Inventario, Facturación, Envíos): filtros, conteos y una ventana de filas.'
      parameters:
        - { name: lista, in: path, required: true, schema: { $ref: '#/components/schemas/NombreLista' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: seg, in: query, schema: { type: string }, description: 'Segmentos, separados por coma' }
        - { name: facetas, in: query, schema: { type: string }, description: 'clave:valor separados por coma (ch:wa,city:Rosario)' }
        - { name: rango, in: query, schema: { type: integer, minimum: 0 } }
        - { name: banderas, in: query, schema: { type: string } }
        - { name: orden, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaGenerica' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas/{lista}/acciones:
    post:
      operationId: accionLista
      summary: Una acción sobre una o varias filas (o la sugerencia de Hornero de esa lista).
      parameters:
        - { name: lista, in: path, required: true, schema: { $ref: '#/components/schemas/NombreLista' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, accion]
              properties:
                ids: { type: array, maxItems: 500, items: { type: string } }
                accion: { type: string }
                valor: { description: 'Lo que la acción necesite (ajuste de stock, publicado…). Facturación: emitir lleva {cliente, tipo, cuit, concepto, total}; reintentar y anular (nota de crédito) usan ids.' }
      responses:
        '200':
          description: Cuántas filas cambiaron
          content:
            application/json:
              schema:
                type: object
                required: [hechos]
                properties:
                  hechos: { type: integer }
        '400': { $ref: '#/components/responses/Problema', description: 'Facturación: el error de ARCA o de los datos, para mostrar tal cual' }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos:
    post:
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos/{id}:
    get:
      operationId: obtenerProducto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarProducto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEditable' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
