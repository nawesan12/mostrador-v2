      operationId: preguntarEnTienda
      summary: Una pregunta sobre un producto publicado; se ve en la ficha cuando la tienda la responde. Tope de 10 por hora por IP.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productoId, nombre, pregunta]
              properties:
                productoId: { type: string }
                nombre: { type: string, minLength: 2, maxLength: 60 }
                email: { type: string, maxLength: 120 }
                pregunta: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/carritos:
    post:
      operationId: guardarCarritoTienda
