openapi: 3.1.0
info:
  title: Mostrador
  version: 0.1.0
  description: |
    Contrato único entre el front (SvelteKit, BFF) y sus dos fuentes de datos: el sandbox de la
    demo (D1) y la API Go. Los casos de `casos/` corren contra las dos implementaciones.
    Montos en centavos (enteros). Fechas de negocio YYYY-MM-DD en hora de Argentina.
    Errores: application/problem+json.
paths:
  /v1/rubros:
    get:
      operationId: listarRubros
      summary: Rubros con su plantilla y tienda de ejemplo
      responses:
        '200':
          description: Rubros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rubro' }
  /v1/auth/registro:
    post:
      operationId: registrar
      summary: Crea la cuenta, su tienda y la sesión (sigue en el onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Alta' }
      responses:
        '201': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/ingresar:
    post:
      operationId: ingresar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string }
                clave: { type: string }
                recordarme: { type: boolean }
      responses:
        '200': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/salir:
    post:
      operationId: salir
      responses:
        '204': { description: Sesión cerrada }
  /v1/auth/sesion:
    get:
      operationId: sesion
      responses:
        '200': { description: Sesión en curso, content: { application/json: { schema: { $ref: '#/components/schemas/DatosSesion' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/auth/recuperar:
    post:
      operationId: recuperar
      summary: Manda el link para crear una contraseña nueva. Responde igual exista o no la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Recibido }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/restablecer:
    post:
      operationId: restablecer
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, clave], properties: { token: { type: string }, clave: { type: string } } }
      responses:
        '204': { description: Contraseña cambiada; se cierran todas las sesiones }
        '400': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/arrepentimientos:
    post:
      operationId: pedirArrepentimiento
      summary: Botón de arrepentimiento (Res. 424/2020). Público, sin sesión; devuelve el código de trámite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoArrepentimiento' }
      responses:
        '201':
          description: Registrado; la confirmación sale por mail
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string, pattern: '^ARR-\d{4}-\d{6,}$' } } }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/contacto:
    post:
      operationId: consultar
      summary: Consulta de ventas (/contacto). Público, sin sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Consulta' }
      responses:
        '202': { description: Registrada; confirmación por mail }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/partners/postulaciones:
    post:
      operationId: postularPartner
      summary: Postulación al programa de partners. Repetir el email no es error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Postulacion' }
      responses:
        '202': { description: Registrada }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/novedades/suscripciones:
    post:
      operationId: suscribirNovedades
      summary: Suma un email al resumen mensual de novedades.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Suscripto (o ya lo estaba) }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/novedades/baja:
    post:
      operationId: bajaNovedades
      summary: Baja con el token del link del mail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Dado de baja }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/panel/onboarding:
    put:
      operationId: guardarOnboarding
      summary: Guarda lo elegido en el onboarding (y si terminó). La plantilla pasa a ser la de la tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Onboarding' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/resumen:
    get:
      operationId: resumenPanel
      summary: Lo que muestra el armazón del panel en cada pantalla (insignias del menú y notificaciones).
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenPanel' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/tablero:
    get:
      operationId: tablero
      summary: El Resumen del panel (dashboard) para un período.
      parameters:
        - name: periodo
          in: query
          schema: { type: string, enum: [hoy, 7d, 30d], default: 7d }
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/meta:
    put:
      operationId: guardarMeta
      summary: La meta de ventas del mes (en pesos; 0 la saca).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objetivo]
              properties:
                objetivo: { type: integer, minimum: 0, maximum: 100000000000 }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/avisos/{aviso}/ocultar:
    post:
      operationId: ocultarAviso
      summary: Descarta un aviso del Resumen (por ahora, el del certificado de ARCA).
      parameters:
        - { name: aviso, in: path, required: true, schema: { type: string, enum: [certificado] } }
      responses:
        '204': { description: Oculto }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/carritos/recordar:
    post:
      operationId: recordarCarritos
      summary: Manda por WhatsApp el recordatorio a los carritos abandonados recuperables.
      responses:
        '200':
          description: Cuántos mensajes quedaron en cola
          content:
            application/json:
              schema:
                type: object
                required: [enviados]
                properties:
                  enviados: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/contexto:
    get:
      operationId: contextoHornero
      summary: Lo que Hornero sabe de la tienda para responder (ventas por día, productos, clientes, pendientes).
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextoHornero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/ideas/{idea}:
    post:
      operationId: marcarIdea
      summary: Aprueba (o deshace) una idea de Hornero.
      parameters:
        - { name: idea, in: path, required: true, schema: { type: string, enum: [carritos, stock, promo] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hecha]
              properties:
                hecha: { type: boolean }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos:
    get:
      operationId: listarPedidos
      summary: Pedidos con filtros (en la URL del panel), conteos por etapa y facetas, y una ventana de filas.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Cliente, número, producto o ciudad' }
        - { name: estado, in: query, schema: { type: string }, description: 'Separados por coma' }
        - { name: canal, in: query, schema: { type: string } }
        - { name: pago, in: query, schema: { type: string } }
        - { name: envio, in: query, schema: { type: string } }
        - { name: fecha, in: query, schema: { type: string, enum: [hoy, 7d, 30d, todo], default: todo } }
        - { name: minimo, in: query, schema: { type: integer, minimum: 0 } }
        - { name: vip, in: query, schema: { type: boolean } }
        - { name: hornero, in: query, schema: { type: boolean } }
        - { name: mayorista, in: query, schema: { type: boolean } }
        - { name: orden, in: query, schema: { type: string, enum: [nuevos, urgentes, monto, viejos], default: nuevos } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaPedidos' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/lote:
    post:
      operationId: pedidosEnLote
      summary: Acción sobre varios pedidos (preparar, etiquetas, facturar, avisar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeros, accion]
              properties:
                numeros: { type: array, maxItems: 500, items: { type: integer } }
                accion: { type: string, enum: [preparar, etiquetas, facturar, avisar] }
      responses:
        '200':
          description: Cuántos se pudieron hacer (los que no estaban en la etapa justa se saltean)
          content:
            application/json:
              schema:
                type: object
                required: [hechos, cambios]
                properties:
                  hechos: { type: integer }
                  cambios:
                    type: array
                    description: 'Para deshacer: número y estado anterior'
                    items:
                      type: object
                      required: [numero, antes]
                      properties:
                        numero: { type: integer }
                        antes: { $ref: '#/components/schemas/EstadoPedido' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}:
    get:
      operationId: obtenerPedido
      summary: El detalle de un pedido.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/estado:
    post:
      operationId: cambiarEstadoPedido
      summary: Avanza el pedido una etapa, lo vuelve una atrás (deshacer) o lo cancela.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPedido' }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/recordatorio:
    post:
      operationId: recordarPago
      summary: Le manda al cliente un recordatorio de pago por WhatsApp.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Enviado }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/tienda:
    get:
      operationId: obtenerTienda
      summary: La tienda de la sesión
      responses:
        '200':
          description: Tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '401':
          description: Sin sesión
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
components:
  responses:
    Problema:
      description: Error (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    ResumenPanel:
      type: object
      required: [insignias, notificaciones, canales, prueba]
      properties:
        insignias:
          type: object
          description: 'Números del menú (0: sin insignia)'
          required: [pedidos, carritos, whatsapp, paraHacer]
          properties:
            pedidos: { type: integer, description: 'Para preparar' }
            carritos: { type: integer, description: 'Carritos abandonados recuperables' }
            whatsapp: { type: integer, description: 'Conversaciones sin leer' }
            paraHacer: { type: integer, description: 'Tareas de hoy' }
        notificaciones:
          type: array
          items: { $ref: '#/components/schemas/Notificacion' }
        canales:
          type: array
          description: 'Canales conectados (ids: wa, ml, mp, ig, tg)'
          items: { type: string }
        prueba:
          type: object
          required: [plan, diasRestantes, diasTotales]
          properties:
            plan: { type: string }
            diasRestantes: { type: integer }
            diasTotales: { type: integer }
    Comparado:
      type: object
      description: 'El valor del período y el del período anterior del mismo largo'
      required: [actual, anterior]
      properties:
        actual: { type: number }
        anterior: { type: number }
    ContextoHornero:
      type: object
      required: [ventasPorDia, productos, clientes, canales30d]
      properties:
        ventasPorDia:
          type: array
          description: 'Últimos 14 días, del más viejo a hoy (hora de Argentina)'
          items:
            type: object
            required: [fecha, ventas, pedidos]
            properties:
              fecha: { type: string, format: date }
              ventas: { type: integer }
              pedidos: { type: integer }
        productos:
          type: array
          items:
            type: object
            required: [nombre, categoria, precio, stock, vendidos30d, enMl]
            properties:
              nombre: { type: string }
              categoria: { type: [string, 'null'] }
              precio: { type: integer }
              stock: { type: integer }
              vendidos30d: { type: integer }
              enMl: { type: boolean }
        clientes:
          type: object
          required: [total, nuevos30d, conWhatsApp, sinVolver]
          properties:
            total: { type: integer }
            nuevos30d: { type: integer }
            conWhatsApp: { type: integer }
            sinVolver: { type: integer, description: 'Compraron más de una vez y hace 30 días que no vuelven' }
        canales30d:
          type: array
          items:
            type: object
            required: [canal, ventas]
            properties:
              canal: { type: string }
              ventas: { type: integer }
    Tablero:
      type: object
      required: [periodo, desde, hasta, hola, ventas, serie, kpis, canales, meta, avisos, ultimosPedidos, paraHacer, enVivo, caja, liquidaciones, hornero, bandeja, integraciones, masVendidos, resenas, envios]
      properties:
        periodo: { type: string, enum: [hoy, 7d, 30d] }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        hola: { type: [string, 'null'], description: 'Nombre de pila de quien entra' }
        ventas: { $ref: '#/components/schemas/Comparado' }
        serie:
          type: object
          description: 'Ventas acumuladas en 14 tramos del período, y las del período anterior'
          required: [actual, anterior]
          properties:
            actual: { type: array, items: { type: number } }
            anterior: { type: array, items: { type: number } }
        kpis:
          type: object
          required: [pedidos, ticket, conversion, clientesNuevos]
          properties:
            pedidos: { $ref: '#/components/schemas/Comparado' }
            ticket: { $ref: '#/components/schemas/Comparado' }
            conversion: { $ref: '#/components/schemas/Comparado', description: 'Porcentaje (3.4 = 3,4 %)' }
            clientesNuevos: { $ref: '#/components/schemas/Comparado' }
        canales:
          type: array
          description: 'Parte de las ventas del período por canal (web, wa, ml, ig, pos, tg), de mayor a menor'
          items:
            type: object
            required: [canal, parte]
            properties:
              canal: { type: string }
              parte: { type: number, description: 'De 0 a 1' }
        meta:
          type: object
          required: [objetivo, actual, proyeccion]
          properties:
            objetivo: { type: integer, description: '0: sin meta' }
            actual: { type: integer, description: 'Vendido en el mes' }
            proyeccion: { type: integer, description: 'Al ritmo actual, cómo cierra el mes' }
        avisos:
          type: object
          required: [certificadoDias]
          properties:
            certificadoDias: { type: [integer, 'null'], description: 'Días para que venza el certificado de ARCA, si hay que avisar' }
        ultimosPedidos:
          type: array
          items: { $ref: '#/components/schemas/PedidoBreve' }
        paraHacer:
          type: object
          required: [preparar, chats, chatMasViejoMin, transferencias, transferenciasMonto, sinStock, sinStockEnMl]
          properties:
            preparar: { type: integer }
            chats: { type: integer }
            chatMasViejoMin: { type: integer }
            transferencias: { type: integer }
            transferenciasMonto: { type: integer }
            sinStock: { type: integer }
            sinStockEnMl: { type: integer }
        enVivo:
          type: object
          required: [personas, paginas, carritos, carritosMonto]
          properties:
            personas: { type: integer }
            paginas:
              type: array
              items:
                type: object
                required: [nombre, personas]
                properties:
                  nombre: { type: string }
                  personas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
        caja:
          type: object
          required: [abierta, total, medios]
          properties:
            abierta: { type: [string, 'null'], format: date-time, description: 'Cuándo se abrió hoy (null: cerrada)' }
            total: { type: integer }
            medios:
              type: array
              items:
                type: object
                required: [medio, monto]
                properties:
                  medio: { type: string, description: 'efectivo, tarjeta, mp, modo, transf' }
                  monto: { type: integer }
        liquidaciones:
          type: array
          description: 'Lo que se acredita en los próximos 7 días, por medio de pago'
          items:
            type: object
            required: [medio, fecha, monto]
            properties:
              medio: { type: string }
              fecha: { type: string, format: date }
              monto: { type: integer }
        hornero:
          type: object
          required: [chatsHoy, ideas, carritos, carritosMonto, costoMensaje, recordados, audiencia, ideasHechas]
          properties:
            chatsHoy: { type: integer }
            ideas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
            costoMensaje: { type: integer, description: 'Lo que cuesta cada mensaje de WhatsApp' }
            recordados: { type: boolean, description: 'Ya se les mandó el recordatorio' }
            audiencia: { type: integer, description: 'Clientes que aceptan mensajes por WhatsApp' }
            ideasHechas:
              type: array
              description: 'Ideas de Hornero ya aprobadas (carritos, stock, promo)'
              items: { type: string }
        bandeja:
          type: array
          items:
            type: object
            required: [nombre, foto, mensaje, creado, atiende, sinLeer]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'], description: 'Id de la foto en Unsplash' }
              mensaje: { type: string }
              creado: { type: string, format: date-time }
              atiende: { type: string, enum: [hornero, vos] }
              sinLeer: { type: integer }
        integraciones:
          type: array
          description: 'Integraciones conectadas con su dato del momento'
          items:
            type: object
            required: [id, valor]
            properties:
              id: { type: string, description: 'mp (cobrado en 7 días), ml (publicaciones), wa (chats esperando), arca (días del certificado), andreani (envíos en camino)' }
              valor: { type: integer }
        masVendidos:
          type: array
          description: 'Los 4 más vendidos de los últimos 7 días'
          items:
            type: object
            required: [productoId, nombre, foto, unidades]
            properties:
              productoId: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              unidades: { type: integer }
        resenas:
          type: object
          required: [promedio, nuevas]
          properties:
            promedio: { type: [number, 'null'] }
            nuevas:
              type: array
              items:
                type: object
                required: [texto, autor, producto, canal, estrellas]
                properties:
                  texto: { type: string }
                  autor: { type: string }
                  producto: { type: string }
                  canal: { type: string }
                  estrellas: { type: integer }
        envios:
          type: object
          required: [paquetes, retiros]
          properties:
            paquetes: { type: integer }
            retiros:
              type: array
              items:
                type: object
                required: [hora, transporte, paquetes, ciudad, proximo]
                properties:
                  hora: { type: string, description: 'HH:MM' }
                  transporte: { type: string, enum: [andreani, oca, correo, moto] }
                  paquetes: { type: integer }
                  ciudad: { type: [string, 'null'], description: 'Si todos van a la misma ciudad' }
                  proximo: { type: boolean }
    EstadoPedido:
      type: string
      enum: [Sin pagar, Para preparar, Listo para despachar, En camino, Entregado, Cancelado]
    PedidoFila:
      type: object
      required: [numero, cliente, foto, ciudad, canal, pago, envio, estado, total, creado, productos, cantidadProductos, vip, hornero, mayorista]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        ciudad: { type: string }
        canal: { type: string }
        pago: { type: string, description: 'mp, tarjeta, payway, modo, uala, transf, efectivo' }
        envio: { type: string, description: 'andreani, oca, correo, moto, retiro' }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
        productos:
          type: array
          description: 'Los primeros 3'
          items:
            type: object
            required: [nombre, foto]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        cantidadProductos: { type: integer }
        vip: { type: boolean }
        hornero: { type: boolean, description: 'Lo vendió Hornero' }
        mayorista: { type: boolean }
    ListaPedidos:
      type: object
      required: [total, suma, filas, etapas, facetas]
      properties:
        total: { type: integer, description: 'Pedidos que cumplen los filtros' }
        suma: { type: integer }
        filas: { type: array, items: { $ref: '#/components/schemas/PedidoFila' } }
        etapas:
          type: object
          description: 'Por estado, con todos los filtros salvo el de estado'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Conteos de canal, pago y envío; cada uno sin su propio filtro'
          required: [canal, pago, envio]
          properties:
            canal: { type: object, additionalProperties: { type: integer } }
            pago: { type: object, additionalProperties: { type: integer } }
            envio: { type: object, additionalProperties: { type: integer } }
    PedidoDetalle:
      allOf:
        - { $ref: '#/components/schemas/PedidoFila' }
        - type: object
          required: [items, subtotal, costoEnvio, comprador, estadoPago, factura, seguimiento, llega, nota, historial]
          properties:
            items:
              type: array
              items:
                type: object
                required: [nombre, foto, cantidad, precio]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  cantidad: { type: integer }
                  precio: { type: integer }
            subtotal: { type: integer }
            costoEnvio: { type: integer }
            comprador:
              type: object
              required: [nombre, foto, telefono, email, desde, pedidos, gastado]
              properties:
                nombre: { type: string }
                foto: { type: [string, 'null'] }
                telefono: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
                desde: { type: string, format: date-time }
                pedidos: { type: integer }
                gastado: { type: integer }
            estadoPago: { type: string, description: 'Aprobado, Acreditada, Pendiente, Cobrado' }
            factura: { type: [string, 'null'], description: 'B 0004-00000812' }
            seguimiento: { type: [string, 'null'] }
            llega: { type: [string, 'null'], format: date }
            nota: { type: [string, 'null'], description: 'Lo que anotó Hornero de la charla' }
            historial:
              type: array
              items:
                type: object
                required: [texto, cuando, hecho]
                properties:
                  texto: { type: string }
                  cuando: { type: [string, 'null'], format: date-time }
                  hecho: { type: boolean }
    PedidoBreve:
      type: object
      required: [numero, cliente, foto, canal, estado, total, creado]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
    Notificacion:
      type: object
      required: [id, tipo, titulo, detalle, creada, leida, grupo]
      properties:
        id: { type: string }
        tipo: { type: string, description: 'Marca o tipo del ícono: wa, mp, ml, warn, arca, star, ok, err' }
        titulo: { type: string }
        detalle: { type: string }
        creada: { type: string, format: date-time }
        leida: { type: boolean }
        grupo: { type: string, enum: [ventas, sistema] }
    Onboarding:
      type: object
      required: [elecciones]
      properties:
        plantilla: { type: string, description: 'Una de las 16 del handoff' }
        elecciones: { type: object, additionalProperties: true, description: 'Objetivos, canales, secciones, cobros y envíos, tono, equipo (hasta 16 KB)' }
        terminado: { type: boolean }
    Consulta:
      type: object
      required: [nombre, email]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        whatsapp: { type: string, description: 'Con característica; se guardan sólo los dígitos' }
        web: { type: string, maxLength: 200 }
        facturacion: { type: string, enum: [empiezo, hasta-5, 5-a-20, 20-a-100, mas-de-100] }
        origen: { type: string, enum: [tiendanube, empretienda, mercadoshops, shopify, woocommerce, ninguna] }
        mensaje: { type: string, maxLength: 2000 }
    Postulacion:
      type: object
      required: [nombre, email, agencia]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        agencia: { type: string, maxLength: 120 }
        web: { type: string, maxLength: 200 }
        especialidades:
          type: array
          items: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    PedidoArrepentimiento:
      type: object
      required: [email, nombre, documento, plan]
      properties:
        email: { type: string, description: 'El de la cuenta' }
        nombre: { type: string, maxLength: 80 }
        documento: { type: string, description: 'DNI o CUIT, con o sin guiones' }
        plan: { type: string, maxLength: 120, description: 'Plan contratado y fecha' }
        motivo: { type: string, maxLength: 1000 }
    Alta:
      type: object
      required: [nombre, tienda, email, clave]
      properties:
        nombre: { type: string }
        tienda: { type: string }
        email: { type: string }
        clave: { type: string, minLength: 8 }
    Sesion:
      type: object
      required: [token, venceEn, tiendaId]
      properties:
        token: { type: string, description: 'Se entrega una sola vez; el BFF lo guarda en una cookie httpOnly' }
        venceEn: { type: string, format: date-time }
        tiendaId: { type: string }
    DatosSesion:
      type: object
      required: [usuario, tiendaId, rol, venceEn]
      properties:
        usuario:
          type: object
          required: [id, nombre, email]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string }
            email: { type: string }
        tiendaId: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, deposito, ''] }
        venceEn: { type: string, format: date-time }
    Rubro:
      type: object
      required: [id, nombre, plantilla, tienda]
      properties:
        id: { type: string, examples: [gastronomia] }
        nombre: { type: string, examples: [Gastronomía] }
        plantilla: { type: string, description: Plantilla de tienda que se usa por defecto }
        tienda: { type: string, description: Nombre de la tienda de ejemplo }
    Plan:
      type: string
      enum: [gratis, emprende, pro, negocio]
    Tienda:
      type: object
      required: [id, slug, nombre, rubro, plantilla, plan, creadaEn]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$' }
        nombre: { type: string }
        rubro: { type: string }
        plantilla: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        creadaEn: { type: string, format: date-time }
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
