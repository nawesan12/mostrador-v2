          type: object
          required: [ventas, productos, clientes, margen]
          properties:
            ventas: { type: array, items: { type: integer } }
            productos: { type: array, items: { type: integer } }
            clientes: { type: array, items: { type: integer } }
            margen: { type: array, items: { type: [integer, 'null'] } }
        kpis:
          type: object
          required: [ventas, ventasVs, ticket, ticketVs, margen, margenVs, ahorro, mesAnterior]
          properties:
            ventas: { type: integer }
            ventasVs: { type: [number, 'null'] }
            ticket: { type: integer }
            ticketVs: { type: [number, 'null'] }
            margen: { type: [integer, 'null'] }
            margenVs: { type: [integer, 'null'] }
            ahorro: { type: integer, description: 'Comisiones que no pagó contra una plataforma con comisión' }
            mesAnterior: { type: string }
        historia: { type: integer, description: 'Meses de historia' }
        insights: { type: array, items: { type: string } }
    Evento:
      type: object
      required: [id, tipo, quien, foto, texto, cuando, donde, deshacer, deshecho]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [equipo, hornero, sistema] }
        quien: { type: string }
        foto: { type: [string, 'null'] }
        texto: { type: string }
        cuando: { type: string, format: date-time }
        donde: { type: string }
        deshacer: { type: boolean, description: 'Se puede volver atrás' }
        deshecho: { type: boolean }
    ParaHacer:
      type: object
      required: [grupos]
