      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, carrito]
              properties:
                email: { type: string, maxLength: 120 }
                nombre: { type: string, maxLength: 80 }
                carrito: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [id, cantidad], properties: { id: { type: string }, varianteId: { type: [string, 'null'] }, cantidad: { type: integer, minimum: 1, maximum: 99 } } } }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { description: Demasiados carritos desde esa IP }
  /v1/publico/tiendas/{slug}/carritos/{token}:
    get:
      operationId: carritoPorToken
