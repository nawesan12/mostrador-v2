      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Pedido y su seguimiento, content: { application/json: { schema: { type: object, required: [numero, total, pago, nombre, estadoPago, estado, envio, seguimiento, alias, cbu, titular], properties: { numero: { type: integer }, total: { type: integer }, pago: { type: string }, nombre: { type: string }, estadoPago: { type: string }, estado: { $ref: '#/components/schemas/EstadoPedido' }, envio: { type: string, enum: [retiro, andreani, oca, correo, moto, mercadoenvios] }, seguimiento: { type: [string, 'null'] }, alias: { type: [string, 'null'] }, cbu: { type: [string, 'null'] }, titular: { type: [string, 'null'] } } } } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadolibre:
    get:
      operationId: conexionMercadoLibre
      summary: Si la tienda conectó su cuenta de Mercado Libre, y cuánto publicó.
