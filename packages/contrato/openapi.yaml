        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionML' }
    put:
      operationId: ajustarMercadoLibre
      summary: Recargo sobre el precio (comisión) y pausar sin stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recargo, pausarSinStock]
              properties:
                recargo: { type: integer, minimum: 0, maximum: 60 }
                pausarSinStock: { type: boolean }
      responses:
        '204': { description: Guardado }
        '409': { $ref: '#/components/responses/Problema' }
