      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Carrito
          content:
            application/json:
              schema: { type: object, required: [carrito], properties: { carrito: { type: array, items: { type: object, required: [id, cantidad], properties: { id: { type: string }, varianteId: { type: [string, 'null'] }, cantidad: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/pedidos/{codigo}:
    get:
      operationId: confirmacionPedido
      summary: La confirmación del pedido por su código público.
