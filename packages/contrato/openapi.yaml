    put:
      operationId: ajustesArca
      summary: Punto de venta y facturar al cobrar, sin tocar el certificado. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                puntoVenta: { type: integer, minimum: 1, maximum: 99998 }
                facturarAlCobrar: { type: boolean }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/probar:
    post:
      operationId: probarArca
      summary: Pide (o reusa) el ticket del WSAA y el último comprobante autorizado del punto de venta.
      responses:
        '200':
          description: Conectada
          content:
            application/json:
              schema:
                type: object
                required: [ok, ultimo, detalle]
                properties:
                  ok: { type: boolean }
                  ultimo: { type: integer, minimum: 0 }
                  detalle: { type: string }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago/conectar:
    post:
      operationId: conectarMercadoPago
      summary: La URL de autorización (state de un solo uso y PKCE). Sólo dueña o admin.
      responses:
        '200':
          description: Adónde mandar a la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago/vuelta:
