      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, estrellas]
              properties:
                codigo: { type: string, description: 'El código público del pedido' }
                productoId: { type: string }
                autor: { type: string, minLength: 2, maxLength: 60 }
                estrellas: { type: integer, minimum: 1, maximum: 5 }
                texto: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
