name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run gen
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mostrador
          POSTGRES_DB: mostrador
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mostrador" --health-interval 2s --health-retries 30
    env:
      MOSTRADOR_BASE_DE_DATOS_TEST: postgres://mostrador@localhost:5432/mostrador?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  jobs-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p apps/jobs

  # Preview del front en cada PR: una versión del Worker con alias pr-N, sin tocar producción.
  preview:
    if: github.event_name == 'pull_request'
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: ¿Hay credenciales de Cloudflare?
        id: cf
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cf.outputs.ok == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.cf.outputs.ok == 'true'
        run: bun install --frozen-lockfile
      - if: steps.cf.outputs.ok == 'true'
        id: subir
        working-directory: apps/web
        run: |
          bun run build
          bunx wrangler versions upload --preview-alias pr-${{ github.event.number }} | tee salida.txt
          echo "url=$(grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' salida.txt | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.cf.outputs.ok == 'true' && steps.subir.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.subir.outputs.url }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} \
            --edit-last --create-if-none --body "Preview del front: $URL"
      - if: steps.cf.outputs.ok != 'true'
        run: echo "::warning::Sin CLOUDFLARE_API_TOKEN todavía; el preview se sube a mano. Ver CREDENCIALES.md §1."

  # Deploy a mostrador.iamnaw.dev en cada push a main, sólo si ya están los secretos de Cloudflare.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, api, jobs-worker]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: ¿Hay credenciales de Cloudflare?
        id: cf
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cf.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.cf.outputs.ok == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.cf.outputs.ok == 'true'
        run: bun install --frozen-lockfile
      - if: steps.cf.outputs.ok == 'true'
        working-directory: apps/web
        run: bun run build && bunx wrangler deploy
      # mostrador-jobs (cron) se suma recién cuando /api/internal/cron exista (PR 4): antes sólo
      # generaría llamadas inútiles cada 15 minutos.
      - if: steps.cf.outputs.ok != 'true'
        run: echo "::warning::Sin CLOUDFLARE_API_TOKEN todavía; no se despliega. Ver CREDENCIALES.md §1."
