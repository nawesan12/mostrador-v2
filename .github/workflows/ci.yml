name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    # Que una colgada (apt, un servidor que no arranca) no quede media hora corriendo.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run gen
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mostrador
          POSTGRES_DB: mostrador
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mostrador" --health-interval 2s --health-retries 30
    env:
      MOSTRADOR_BASE_DE_DATOS_TEST: postgres://mostrador@localhost:5432/mostrador?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  # La app real de punta a punta: web en modo API + API Go + Postgres + Mailpit (registro, ingreso,
  # recuperar por mail, contraseña nueva, salir).
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mostrador
          POSTGRES_DB: mostrador
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mostrador" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      MOSTRADOR_BASE_DE_DATOS_ADMIN: postgres://mostrador@localhost:5432/mostrador?sslmode=disable
      MOSTRADOR_BASE_DE_DATOS_MIGRADOR: postgres://mostrador_migrador@localhost:5432/mostrador_dev?sslmode=disable
      MOSTRADOR_BASE_DE_DATOS: postgres://mostrador_app@localhost:5432/mostrador_dev?sslmode=disable
      # Sin esta, en desarrollo la API busca el rol del backoffice en el Postgres de compose (:5440).
      MOSTRADOR_BASE_DE_DATOS_STAFF: postgres://mostrador_staff@localhost:5432/mostrador_dev?sslmode=disable
      MOSTRADOR_SMTP: 127.0.0.1:1025
      MOSTRADOR_CLAVE_BFF: clave-bff-e2e
      MOSTRADOR_DIRECCION: ':4000'
      E2E_MAILPIT: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Base y API
        working-directory: apps/api
        run: |
          go run ./cmd/mostradorctl bootstrap
          go run ./cmd/mostradorctl migrar
          go build -o /tmp/api ./cmd/api
          go build -o /tmp/worker ./cmd/worker
          /tmp/api > /tmp/api.log 2>&1 &
          # El worker manda lo que sale por el outbox (invitaciones, avisos): sin él esos mails no llegan.
          /tmp/worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/salud/listo && break; sleep 1; done
          # Si la API no arrancó, que falle acá y no en los e2e (con «Network connection lost»).
          curl -sf localhost:4000/salud/listo || (cat /tmp/api.log; exit 1)
      - name: Web en modo API
        working-directory: apps/web
        run: |
          bun run gen
          bun run build
          bunx playwright install --with-deps chromium
          bun run test:e2e:api
      - if: failure()
        run: cat /tmp/api.log /tmp/worker.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-integracion
          path: apps/web/test-results

  # El deploy es al VPS (scripts/desplegar-vps.sh), no desde el CI: nada se publica en Cloudflare.
