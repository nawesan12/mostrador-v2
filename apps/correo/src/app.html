<!doctype html>
<html lang="es-AR" data-tema="%correo.tema%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" type="image/svg+xml" href="/correo.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#040b18" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Correo" />
		<meta
			name="description"
			content="Todas las casillas de Grupo Vimo y sus productos, en un solo lugar."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Correo · Grupo Vimo" />

		<meta
			property="og:description"
			content="Todas las casillas de Grupo Vimo y sus productos, en un solo lugar."
		/>
		<meta property="og:url" content="https://correo.grupovimo.com.ar/" />
		<meta property="og:image" content="https://correo.grupovimo.com.ar/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Correo de Grupo Vimo: el logo con un sobre y los íconos de sus productos."
		/>
		<meta property="og:locale" content="es_AR" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://correo.grupovimo.com.ar/og.jpg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
