<!doctype html>
<html lang="es-AR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#f7f1ea" />
		<link rel="icon" type="image/svg+xml" href="/mark.svg" />
		<title>Sin conexión · Tu Local Web</title>
		<!-- La guarda el service worker del panel (sw-panel.js): tiene que andar sola, sin red. Los
		     colores y el botón son los del panel (app.css: --bg, --tx, --mu, .btn-primary). -->
		<style>
			:root {
				--bg: #f7f1ea;
				--tx: #2a140c;
				--mu: #6b5244;
				color-scheme: light;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--tx);
				font-family: 'Instrument Sans Variable', 'Instrument Sans', system-ui, -apple-system, sans-serif;
			}
			main {
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
				text-align: center;
			}
			.marca {
				position: absolute;
				top: max(18px, env(safe-area-inset-top));
				width: 34px;
				height: 34px;
			}
			img.hornero {
				width: 160px;
				height: 160px;
			}
			h1 {
				margin: 0;
				font-size: 26px;
				letter-spacing: -0.03em;
				font-weight: 600;
				text-wrap: balance;
			}
			p {
				max-width: 340px;
				margin: 0;
				font-size: 15px;
				line-height: 1.5;
				color: var(--mu);
				text-wrap: pretty;
			}
			button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 44px;
				margin-top: 6px;
				padding: 12px 24px;
				border: 0;
				border-radius: 999px;
				background: linear-gradient(180deg, #ee7a4a 0%, #d2582f 55%, #bc4920 100%);
				box-shadow:
					inset 0 2px 0 rgba(255, 255, 255, 0.38),
					inset 0 -3px 0 rgba(120, 38, 12, 0.35),
					0 1px 2px rgba(120, 38, 12, 0.3),
					0 14px 30px -12px rgba(210, 88, 47, 0.85);
				color: #fff;
				font: inherit;
				font-size: 15px;
				font-weight: 600;
				cursor: pointer;
			}
			button[disabled] {
				opacity: 0.7;
			}
		</style>
	</head>
	<body>
		<main>
			<img class="marca" src="/mark.svg" alt="Tu Local Web" />
			<img class="hornero" src="/hornero/desenchufado.webp" alt="" width="160" height="160" />
			<h1>Sin conexión</h1>
			<p>No pudimos llegar a tu panel. Revisá el wifi o los datos y probá de&nbsp;nuevo.</p>
			<button type="button" id="reintentar">Reintentar</button>
		</main>
		<script>
			const b = document.getElementById('reintentar');
			const volver = () => location.reload();
			b.addEventListener('click', () => {
				b.disabled = true;
				b.textContent = 'Probando…';
				volver();
			});
			// Si vuelve la red, se recarga solo.
			addEventListener('online', volver);
		</script>
	</body>
</html>
