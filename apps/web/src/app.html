<!doctype html>
<html lang="es-AR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FBF7F2" />
		<link rel="icon" type="image/svg+xml" href="/mark.svg" />
		<!-- Quien ya eligió cookies no ve el banner (que llega en el HTML, así pinta enseguida). -->
		<script>
			try {
				// Sólo una elección válida (como leerEleccion): 'all', 'nec' o {an, mk}.
				var c = localStorage.getItem('mostrador-cookies');
				var ok = c === 'all' || c === 'nec';
				if (!ok && c) {
					var o = JSON.parse(c);
					ok = !!o && typeof o === 'object' && !Array.isArray(o);
				}
				if (ok) document.documentElement.dataset.cookies = '1';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
